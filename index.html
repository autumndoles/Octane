<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Octane</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #151515;

    color: white;

    font-family: Arial, sans-serif;

    touch-action: none;
}

button,
input {
    font: inherit;
}

button {
    border: 0;

    border-radius: 8px;

    padding: 12px 18px;

    margin: 5px;

    color: white;

    background: #d93434;

    font-weight: bold;

    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

input {
    width: 100%;

    padding: 12px;

    margin: 6px 0;

    border: 0;

    border-radius: 8px;

    font-size: 17px;
}

.screen {
    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #171717;

    z-index: 100;
}

.hidden {
    display: none !important;
}

.box {
    width: min(
        92%,
        420px
    );

    padding: 28px;

    text-align: center;

    background: #292929;

    border-radius: 12px;
}

.logo {
    font-size: 58px;
}

h1 {
    margin: 5px;

    font-size: 42px;
}

#error,
#joinError {
    color: #ff7777;

    margin-top: 10px;
}

#roomCode {
    font-size: 42px;

    font-weight: bold;

    letter-spacing: 7px;

    margin: 20px;
}

#playersList {
    background: #191919;

    padding: 12px;

    border-radius: 8px;

    margin: 12px 0;
}

#gameCanvas {
    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    display: block;
}

#hud {
    position: fixed;

    top: 8px;

    left: 8px;

    z-index: 10;

    padding: 9px;

    border-radius: 8px;

    background:
        rgba(
            0,
            0,
            0,
            .8
        );

    font-size: 13px;
}

#hud h2 {
    margin: 0 0 5px;
}

#menu {
    position: fixed;

    right: 8px;

    top: 8px;

    z-index: 10;

    width: 180px;

    padding: 8px;

    border-radius: 8px;

    background:
        rgba(
            0,
            0,
            0,
            .8
        );

    max-height: 90vh;

    overflow-y: auto;
}

#menu button {
    width: 100%;

    padding: 8px;

    margin: 2px 0;

    font-size: 12px;
}

#roomDisplay {
    position: fixed;

    top: 8px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding: 7px 14px;

    background:
        rgba(
            0,
            0,
            0,
            .8
        );

    border-radius: 20px;
}

#controls {
    position: fixed;

    left: 8px;

    bottom: 8px;

    z-index: 20;

    padding: 8px;

    background:
        rgba(
            0,
            0,
            0,
            .75
        );

    border-radius: 8px;

    font-size: 12px;
}

/* Mobile joystick */

#joystick {
    display: none;

    position: fixed;

    left: 25px;

    bottom: 25px;

    width: 120px;

    height: 120px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .15
        );

    z-index: 30;
}

#stick {
    position: absolute;

    left: 35px;

    top: 35px;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .5
        );
}

#interactButton {
    display: none;

    position: fixed;

    right: 25px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    z-index: 30;

    background: #d93434;

    font-size: 15px;
}

#cancelButton {
    display: none;

    position: fixed;

    right: 30px;

    bottom: 140px;

    z-index: 30;
}

@media (
    max-width: 700px
) {

    #joystick,
    #interactButton {
        display: block;
    }

    #controls {
        display: none;
    }

    #menu {
        width: 145px;
    }

    #menu button {
        font-size: 10px;
    }

}

</style>

</head>

<body>

<div
    id="mainMenu"
    class="screen"
>

<div class="box">

<div class="logo">
⛽
</div>

<h1>
OCTANE
</h1>

<p>
Run the gas station together.
</p>

<input
    id="nameInput"
    maxlength="20"
    placeholder="Your name"
>

<button onclick="createGame()">
CREATE GAME
</button>

<button onclick="showJoin()">
JOIN GAME
</button>

<div id="error"></div>

</div>

</div>

<div
    id="joinScreen"
    class="screen hidden"
>

<div class="box">

<h1>
JOIN GAME
</h1>

<input
    id="joinCode"
    maxlength="4"
    placeholder="ROOM CODE"
>

<button onclick="joinGame()">
JOIN
</button>

<button onclick="showMain()">
BACK
</button>

<div id="joinError"></div>

</div>

</div>

<div
    id="lobbyScreen"
    class="screen hidden"
>

<div class="box">

<h1>
⛽ OCTANE
</h1>

<p>
Room Code:
</p>

<div id="roomCode">
----
</div>

<div id="playersList">
Waiting...
</div>

<button
    id="startButton"
    onclick="startGame()"
>
START GAME
</button>

</div>

</div>

<canvas
    id="gameCanvas"
></canvas>

<div
    id="roomDisplay"
    class="hidden"
>
ROOM:
<span id="roomCodeHUD"></span>
</div>

<div
    id="hud"
    class="hidden"
>

<h2>
⛽ OCTANE
</h2>

<div>
💰 $
<span id="money">
100
</span>
</div>

<div>
⛽ Fuel:
<span id="fuel">
40/100
</span>
</div>

<div>
📦 Stock:
<span id="stock">
20/40
</span>
</div>

<div>
📦 Boxes:
<span id="boxes">
10
</span>
</div>

<div>
🧹 Clean:
<span id="clean">
100
</span>%
</div>

<div>
📅 Day:
<span id="day">
1
</span>
</div>

<div>
🕐
<span id="time">
08:00
</span>
</div>

</div>

<div
    id="menu"
    class="hidden"
>

<b>
Hire Helpers
</b>

<button onclick="hireBot('fuel')">
⛽ Fuel Worker $50
</button>

<button onclick="hireBot('cashier')">
💵 Cashier $50
</button>

<button onclick="hireBot('restocker')">
📦 Restocker $50
</button>

<button onclick="hireBot('cleaner')">
🧹 Cleaner $50
</button>

<hr>

<b>
Upgrades
</b>

<button onclick="upgrade('pump')">
⛽ Pump $250
</button>

<button onclick="upgrade('shelves')">
🛒 Shelves $200
</button>

<button onclick="upgrade('employees')">
👷 Employees $300
</button>

</div>

<div id="controls">
WASD / Arrow Keys:
Move
<br>
E:
Work / Interact
<br>
Space:
Cancel task
</div>

<div id="joystick">

<div id="stick"></div>

</div>

<button
    id="interactButton"
>
INTERACT
</button>

<button
    id="cancelButton"
>
CANCEL
</button>

<script>

const socket =
    io({
        transports: [
            "websocket",
            "polling"
        ]
    });

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const WORLD = {
    width: 1400,
    height: 800
};

let state = {
    players: {},
    bots: {},
    customers: {},
    tasks: [],
    upgrades: {
        pumps: 2
    }
};

let myId = null;

let roomCode = "";

let camera = {
    x: 0,
    y: 0
};

const keys = {};

function showMain() {

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            s =>
                s.classList.add(
                    "hidden"
                )
        );

    document
        .getElementById(
            "mainMenu"
        )
        .classList.remove(
            "hidden"
        );
}

function showJoin() {

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            s =>
                s.classList.add(
                    "hidden"
                )
        );

    document
        .getElementById(
            "joinScreen"
        )
        .classList.remove(
            "hidden"
        );
}

function createGame() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();

    if (!name) {

        document
            .getElementById(
                "error"
            )
            .textContent =
            "Enter your name.";

        return;
    }

    socket.emit(
        "createRoom",
        name
    );
}

function joinGame() {

    const name =
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim();

    const code =
        document
            .getElementById(
                "joinCode"
            )
            .value
            .trim()
            .toUpperCase();

    socket.emit(
        "joinRoom",
        {
            name,
            code
        }
    );
}

socket.on(
    "roomJoined",
    data => {

        myId =
            data.playerId;

        roomCode =
            data.roomCode;

        document
            .getElementById(
                "roomCode"
            )
            .textContent =
            roomCode;

        document
            .getElementById(
                "roomCodeHUD"
            )
            .textContent =
            roomCode;
    }
);

socket.on(
    "roomError",
    message => {

        document
            .getElementById(
                "joinError"
            )
            .textContent =
            message;
    }
);

socket.on(
    "gameState",
    newState => {

        state =
            newState;

        updateHUD();

        if (
            !state.started
        ) {

            document
                .querySelectorAll(
                    ".screen"
                )
                .forEach(
                    s =>
                        s.classList.add(
                            "hidden"
                        )
                );

            document
                .getElementById(
                    "lobbyScreen"
                )
                .classList.remove(
                    "hidden"
                );

            updateLobby();

            return;
        }

        document
            .querySelectorAll(
                ".screen"
            )
            .forEach(
                s =>
                    s.classList.add(
                        "hidden"
                    )
            );

        document
            .getElementById(
                "hud"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "menu"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "roomDisplay"
            )
            .classList.remove(
                "hidden"
            );
    }
);

function updateLobby() {

    const list =
        document
            .getElementById(
                "playersList"
            );

    list.innerHTML =
        Object.values(
            state.players || {}
        )
        .map(
            p =>
                "👤 " +
                escapeHTML(
                    p.name
                )
        )
        .join(
            "<br>"
        );
}

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}

function startGame() {

    socket.emit(
        "startGame"
    );
}

function hireBot(
    job
) {

    socket.emit(
        "hireBot",
        job
    );
}

function upgrade(
    type
) {

    socket.emit(
        "upgrade",
        type
    );
}

function updateHUD() {

    document
        .getElementById(
            "money"
        )
        .textContent =
        state.money;

    document
        .getElementById(
            "fuel"
        )
        .textContent =
        state.fuel +
        "/" +
        state.maxFuel;

    document
        .getElementById(
            "stock"
        )
        .textContent =
        state.storeStock +
        "/" +
        state.maxStoreStock;

    document
        .getElementById(
            "boxes"
        )
        .textContent =
        state.boxes;

    document
        .getElementById(
            "clean"
        )
        .textContent =
        state.cleanliness;

    document
        .getElementById(
            "day"
        )
        .textContent =
        state.day;

    document
        .getElementById(
            "time"
        )
        .textContent =
        state.time;
}

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if (
            key === "e" &&
            !event.repeat
        ) {

            socket.emit(
                "interact"
            );
        }

        if (
            key === " "
        ) {

            socket.emit(
                "cancelTask"
            );
        }
    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);

setInterval(
    () => {

        socket.emit(
            "move",
            {
                up:
                    keys.w ||
                    keys.arrowup,

                down:
                    keys.s ||
                    keys.arrowdown,

                left:
                    keys.a ||
                    keys.arrowleft,

                right:
                    keys.d ||
                    keys.arrowright
            }
        );

    },
    66
);

document
    .getElementById(
        "interactButton"
    )
    .addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            socket.emit(
                "interact"
            );
        }
    );

document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            socket.emit(
                "cancelTask"
            );
        }
    );

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive = false;

let joystickX = 0;

let joystickY = 0;

joystick.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        joystickActive = true;
    }
);

joystick.addEventListener(
    "touchmove",
    event => {

        if (
            !joystickActive
        ) {
            return;
        }

        event.preventDefault();

        const touch =
            event.touches[0];

        const rect =
            joystick.getBoundingClientRect();

        let x =
            touch.clientX -
            (
                rect.left +
                rect.width / 2
            );

        let y =
            touch.clientY -
            (
                rect.top +
                rect.height / 2
            );

        const length =
            Math.hypot(
                x,
                y
            );

        if (
            length > 40
        ) {

            x =
                x / length * 40;

            y =
                y / length * 40;
        }

        joystickX =
            x / 40;

        joystickY =
            y / 40;

        stick.style.transform =
            `translate(${x}px, ${y}px)`;
    }
);

joystick.addEventListener(
    "touchend",
    () => {

        joystickActive = false;

        joystickX = 0;

        joystickY = 0;

        stick.style.transform =
            "translate(0, 0)";
    }
);

setInterval(
    () => {

        if (
            Math.abs(
                joystickX
            ) > 0.1 ||
            Math.abs(
                joystickY
            ) > 0.1
        ) {

            socket.emit(
                "move",
                {
                    up:
                        joystickY < -0.2,

                    down:
                        joystickY > 0.2,

                    left:
                        joystickX < -0.2,

                    right:
                        joystickX > 0.2
                }
            );
        }

    },
    66
);

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

function updateCamera() {

    const player =
        state.players[
            myId
        ];

    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD.width -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD.height -
                canvas.height,
                camera.y
            )
        );
}

function drawBuilding() {

    ctx.fillStyle =
        "#ddd";

    ctx.fillRect(
        350 -
        camera.x,
        170 -
        camera.y,
        550,
        430
    );

    ctx.fillStyle =
        "#d93434";

    ctx.fillRect(
        350 -
        camera.x,
        170 -
        camera.y,
        550,
        65
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 30px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "OCTANE",
        625 -
        camera.x,
        212 -
        camera.y
    );

    drawBox(
        470,
        230,
        120,
        80,
        "#333",
        "REGISTER"
    );

    drawBox(
        680,
        230,
        150,
        200,
        "#8b5a2b",
        "STORE"
    );

    drawBox(
        390,
        450,
        150,
        100,
        "#704214",
        "STORAGE"
    );

    drawBox(
        570,
        500,
        120,
        70,
        "#2288aa",
        "CLEAN"
    );

    for (
        let i = 0;
        i <
        state.upgrades.pumps;
        i++
    ) {

        const pumpX =
            [
                980,
                1120,
                1260,
                1330
            ][i];

        drawBox(
            pumpX - 30,
            180,
            60,
            100,
            "#333",
            "PUMP"
        );
    }
}

function drawBox(
    x,
    y,
    width,
    height,
    color,
    label
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x -
        camera.x,
        y -
        camera.y,
        width,
        height
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x +
        width / 2 -
        camera.x,
        y +
        height / 2 -
        camera.y
    );
}

function drawEntity(
    entity,
    color,
    label
) {

    const x =
        entity.x -
        camera.x;

    const y =
        entity.y -
        camera.y;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "10px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x,
        y - 20
    );

    if (
        entity.task
    ) {

        ctx.fillText(
            "●",
            x,
            y + 28
        );
    }

    if (
        entity.carrying
    ) {

        ctx.fillText(
            "📦",
            x,
            y + 35
        );
    }
}

function drawCustomer(
    customer
) {

    let color =
        "#f5a623";

    if (
        customer.state ===
        "leaving"
    ) {

        color =
            "#777";
    }

    drawEntity(
        customer,
        color,
        "Customer"
    );
}

function drawTask(
    task
) {

    if (
        task.type !==
        "clean"
    ) {
        return;
    }

    ctx.fillStyle =
        "#8b4513";

    ctx.beginPath();

    ctx.arc(
        task.x -
        camera.x,
        task.y -
        camera.y,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "10px Arial";

    ctx.fillText(
        "CLEAN",
        task.x -
        camera.x,
        task.y -
        camera.y -
        18
    );
}

function render() {

    ctx.fillStyle =
        "#619b5c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "#444";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        WORLD.width,
        130
    );

    ctx.fillRect(
        -camera.x,
        650 -
        camera.y,
        WORLD.width,
        150
    );

    drawBuilding();

    for (
        const task of
        state.tasks || []
    ) {

        drawTask(task);
    }

    for (
        const customer of
        Object.values(
            state.customers || {}
        )
    ) {

        drawCustomer(
            customer
        );
    }

    for (
        const bot of
        Object.values(
            state.bots || {}
        )
    ) {

        drawEntity(
            bot,
            "#9b59b6",
            "BOT"
        );
    }

    for (
        const player of
        Object.values(
            state.players || {}
        )
    ) {

        drawEntity(
            player,
            player.color,
            player.name
        );
    }

    updateCamera();

    requestAnimationFrame(
        render
    );
}

requestAnimationFrame(
    render
);

</script>

</body>

</html>
