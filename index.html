
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Octane: Gas station simulator</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background:
        #111;

    color:
        white;

    font-family:
        Arial,
        sans-serif;

}

body {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

}

button,
input {

    font-family:
        inherit;

}

button {

    border:
        0;

    border-radius:
        8px;

    padding:
        10px 16px;

    font-weight:
        bold;

    cursor:
        pointer;

    background:
        #e53935;

    color:
        white;

}

button:hover {

    filter:
        brightness(1.15);

}

button:active {

    transform:
        scale(0.96);

}

input {

    padding:
        10px;

    border:
        0;

    border-radius:
        7px;

    width:
        220px;

    background:
        #222;

    color:
        white;

    outline:
        none;

}


/* =====================================================
   SCREENS
===================================================== */

.screen {

    position:
        absolute;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        #111;

}

.hidden {

    display:
        none !important;

}


/* =====================================================
   MENU
===================================================== */

.menu {

    width:
        min(92vw, 420px);

    padding:
        30px;

    text-align:
        center;

    background:
        #1d1d1d;

    border-radius:
        14px;

}

.logo {

    font-size:
        52px;

    font-weight:
        900;

    letter-spacing:
        4px;

    color:
        #ff4b3e;

    margin-bottom:
        4px;

}

.subtitle {

    color:
        #aaa;

    margin-bottom:
        25px;

}

.menu input {

    display:
        block;

    width:
        100%;

    margin:
        8px 0;

}

.menu button {

    width:
        100%;

    margin:
        5px 0;

}

#roomCodeInput {

    text-transform:
        uppercase;

}

#errorText {

    min-height:
        20px;

    color:
        #ff7777;

    font-size:
        14px;

}


/* =====================================================
   LOBBY
===================================================== */

.lobby {

    width:
        min(92vw, 500px);

    padding:
        30px;

    background:
        #1d1d1d;

    border-radius:
        14px;

    text-align:
        center;

}

.room-code {

    font-size:
        38px;

    font-weight:
        bold;

    letter-spacing:
        8px;

    color:
        #ffd43b;

    margin:
        15px 0;

}

#playerList {

    background:
        #111;

    border-radius:
        8px;

    padding:
        12px;

    margin:
        15px 0;

    text-align:
        left;

}

.player-entry {

    padding:
        7px;

    border-bottom:
        1px solid #333;

}

.player-entry:last-child {

    border-bottom:
        none;

}

.host {

    color:
        #ffd43b;

}


/* =====================================================
   GAME
===================================================== */

#gameScreen {

    background:
        #111;

    flex-direction:
        column;

}

#gameCanvas {

    width:
        min(100vw, 640px);

    height:
        auto;

    max-height:
        calc(100vh - 85px);

    aspect-ratio:
        16 / 9;

    image-rendering:
        auto;

    background:
        #87a96b;

    touch-action:
        none;

}


/* =====================================================
   HUD
===================================================== */

#hud {

    width:
        min(100vw, 640px);

    height:
        85px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-around;

    background:
        #181818;

    font-size:
        13px;

    z-index:
        10;

}

.stat {

    text-align:
        center;

    min-width:
        55px;

}

.stat-value {

    font-weight:
        bold;

    font-size:
        16px;

}

.stat-label {

    color:
        #999;

    font-size:
        10px;

}


/* =====================================================
   GAME BUTTONS
===================================================== */

#gameButtons {

    position:
        absolute;

    right:
        10px;

    bottom:
        95px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        7px;

}

.gameButton {

    width:
        52px;

    height:
        42px;

    padding:
        0;

    background:
        rgba(
            0,
            0,
            0,
            0.7
        );

    border:
        1px solid
        #555;

}

#interactButton {

    background:
        #e53935;

}


/* =====================================================
   TOUCH CONTROLS
===================================================== */

#touchControls {

    display:
        none;

    position:
        absolute;

    left:
        15px;

    bottom:
        95px;

    width:
        130px;

    height:
        130px;

}

.touchButton {

    position:
        absolute;

    width:
        42px;

    height:
        42px;

    padding:
        0;

    background:
        rgba(
            0,
            0,
            0,
            0.65
        );

    border:
        1px solid
        #666;

    user-select:
        none;

    touch-action:
        none;

}

#touchUp {

    left:
        44px;

    top:
        0;

}

#touchLeft {

    left:
        0;

    top:
        44px;

}

#touchRight {

    right:
        0;

    top:
        44px;

}

#touchDown {

    left:
        44px;

    bottom:
        0;

}


@media (
    pointer: coarse
) {

    #touchControls {

        display:
            block;

    }

}


/* =====================================================
   CONNECTION
===================================================== */

#connectionStatus {

    position:
        absolute;

    top:
        8px;

    left:
        8px;

    padding:
        5px 8px;

    border-radius:
        5px;

    background:
        rgba(
            0,
            0,
            0,
            0.65
        );

    font-size:
        11px;

    z-index:
        20;

}

.connected {

    color:
        #69db7c;

}

.disconnected {

    color:
        #ff6b6b;

}


/* =====================================================
   HELP
===================================================== */

#helpText {

    position:
        absolute;

    left:
        50%;

    bottom:
        88px;

    transform:
        translateX(-50%);

    padding:
        6px 10px;

    border-radius:
        5px;

    background:
        rgba(
            0,
            0,
            0,
            0.7
        );

    font-size:
        11px;

    pointer-events:
        none;

    opacity:
        0.8;

}


/* =====================================================
   UPGRADE PANEL
===================================================== */

#upgradePanel {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        min(
            90vw,
            320px
        );

    padding:
        20px;

    background:
        #222;

    border:
        1px solid
        #555;

    border-radius:
        12px;

    z-index:
        50;

}

#upgradePanel h2 {

    margin-top:
        0;

}

.upgradeRow {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        8px 0;

}

.upgradeRow button {

    padding:
        7px 10px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 500px
) {

    .logo {

        font-size:
            42px;

    }

    .menu {

        padding:
            24px;

    }

    #hud {

        font-size:
            11px;

    }

    .stat-value {

        font-size:
            14px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MENU
===================================================== -->

<div
    id="menuScreen"
    class="screen"
>

<div class="menu">

<div class="logo">
OCTANE
</div>

<div class="subtitle">
Co-op Gas Station Simulator
</div>


<input
    id="nameInput"
    placeholder="Your name"
    maxlength="20"
>


<button
    id="createButton"
>
Create Station
</button>


<input
    id="roomCodeInput"
    placeholder="Room Code"
    maxlength="4"
>


<button
    id="joinButton"
>
Join Station
</button>


<div id="errorText"></div>

</div>

</div>


<!-- =====================================================
     LOBBY
===================================================== -->

<div
    id="lobbyScreen"
    class="screen hidden"
>

<div class="lobby">

<h1>
Station Lobby
</h1>

<div>
Room Code
</div>

<div
    id="roomCodeDisplay"
    class="room-code"
>
----
</div>


<div id="playerList">
Waiting for players...
</div>


<button
    id="startButton"
    class="hidden"
>
Start Shift
</button>


<div
    id="waitingText"
>
Waiting for the host...
</div>

</div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div
    id="gameScreen"
    class="screen hidden"
>


<div id="connectionStatus">
Connecting...
</div>


<canvas
    id="gameCanvas"
    width="640"
    height="360"
></canvas>


<div id="helpText">
WASD / Arrow Keys to move • E / Interact
</div>


<div id="gameButtons">

<button
    id="interactButton"
    class="gameButton"
>
E
</button>

<button
    id="hireButton"
    class="gameButton"
>
🤖
</button>

<button
    id="upgradeButton"
    class="gameButton"
>
⬆
</button>

</div>


<div id="touchControls">

<button
    class="touchButton"
    id="touchUp"
>
▲
</button>

<button
    class="touchButton"
    id="touchLeft"
>
◀
</button>

<button
    class="touchButton"
    id="touchRight"
>
▶
</button>

<button
    class="touchButton"
    id="touchDown"
>
▼
</button>

</div>


<div id="hud">

<div class="stat">

<div
    class="stat-value"
    id="moneyValue"
>
$100
</div>

<div class="stat-label">
MONEY
</div>

</div>


<div class="stat">

<div
    class="stat-value"
    id="fuelValue"
>
50
</div>

<div class="stat-label">
FUEL
</div>

</div>


<div class="stat">

<div
    class="stat-value"
    id="stockValue"
>
20
</div>

<div class="stat-label">
STOCK
</div>

</div>


<div class="stat">

<div
    class="stat-value"
    id="cleanValue"
>
100%
</div>

<div class="stat-label">
CLEAN
</div>

</div>


<div class="stat">

<div
    class="stat-value"
    id="dayValue"
>
DAY 1
</div>

<div class="stat-label">
SHIFT
</div>

</div>

</div>


</div>


<!-- =====================================================
     UPGRADE PANEL
===================================================== -->

<div
    id="upgradePanel"
    class="hidden"
>

<h2>
Station Upgrades
</h2>


<div class="upgradeRow">

<span>
Add Pump ($250)
</span>

<button
    data-upgrade="pump"
>
BUY
</button>

</div>


<div class="upgradeRow">

<span>
Bigger Shelves ($200)
</span>

<button
    data-upgrade="shelves"
>
BUY
</button>

</div>


<div class="upgradeRow">

<span>
Hire Capacity ($300)
</span>

<button
    data-upgrade="employees"
>
BUY
</button>

</div>


<button
    id="closeUpgrade"
>
Close
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>


/* =====================================================
   SOCKET
===================================================== */

const socket =
    io({

        transports: [
            "polling",
            "websocket"
        ],

        reconnection:
            true,

        reconnectionAttempts:
            10,

        reconnectionDelay:
            1000

    });


/* =====================================================
   DOM
===================================================== */

const menuScreen =
    document.getElementById(
        "menuScreen"
    );

const lobbyScreen =
    document.getElementById(
        "lobbyScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );

const roomCodeInput =
    document.getElementById(
        "roomCodeInput"
    );


const createButton =
    document.getElementById(
        "createButton"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


const errorText =
    document.getElementById(
        "errorText"
    );


const roomCodeDisplay =
    document.getElementById(
        "roomCodeDisplay"
    );

const playerList =
    document.getElementById(
        "playerList"
    );


const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


/* =====================================================
   GAME STATE
===================================================== */

let myId =
    null;

let isHost =
    false;

let currentRoom =
    null;

let keys = {

    up:
        false,

    down:
        false,

    left:
        false,

    right:
        false

};


let remoteEntities =
    new Map();


/* =====================================================
   CONNECTION
===================================================== */

socket.on(
    "connect",
    () => {

        connectionStatus.textContent =
            "Connected";

        connectionStatus.className =
            "connected";

    }
);


socket.on(
    "disconnect",
    () => {

        connectionStatus.textContent =
            "Disconnected";

        connectionStatus.className =
            "disconnected";

    }
);


socket.on(
    "connect_error",
    () => {

        errorText.textContent =
            "Unable to connect to Octane server.";

    }
);


socket.on(
    "errorMessage",
    message => {

        errorText.textContent =
            message;

        setTimeout(
            () => {

                errorText.textContent =
                    "";

            },
            4000
        );

    }
);


/* =====================================================
   CREATE ROOM
===================================================== */

createButton.onclick =
    () => {

        const name =
            nameInput.value.trim();


        if (
            !name
        ) {

            errorText.textContent =
                "Enter your name first.";

            return;

        }


        errorText.textContent =
            "Creating station...";


        socket.emit(
            "createRoom",
            name
        );

    };


/* =====================================================
   JOIN ROOM
===================================================== */

joinButton.onclick =
    () => {

        const name =
            nameInput.value.trim();

        const code =
            roomCodeInput.value
                .trim()
                .toUpperCase();


        if (
            !name
        ) {

            errorText.textContent =
                "Enter your name first.";

            return;

        }


        if (
            code.length !==
            4
        ) {

            errorText.textContent =
                "Enter a 4-character room code.";

            return;

        }


        socket.emit(
            "joinRoom",
            {

                name,

                code

            }
        );

    };


/* =====================================================
   JOINED
===================================================== */

socket.on(
    "joined",
    data => {

        myId =
            data.playerId;

        isHost =
            data.isHost;


        roomCodeDisplay.textContent =
            data.roomCode;


        menuScreen.classList.add(
            "hidden"
        );


        lobbyScreen.classList.remove(
            "hidden"
        );


        if (
            isHost
        ) {

            startButton.classList.remove(
                "hidden"
            );

        }

    }
);


/* =====================================================
   START
===================================================== */

startButton.onclick =
    () => {

        socket.emit(
            "startGame"
        );

    };


/* =====================================================
   STATE
===================================================== */

socket.on(
    "state",
    state => {

        currentRoom =
            state;


        if (
            state.started
        ) {

            lobbyScreen.classList.add(
                "hidden"
            );

            gameScreen.classList.remove(
                "hidden"
            );

        }


        updateHUD(
            state
        );


        updateLobby(
            state
        );

    }
);


/* =====================================================
   LOBBY
===================================================== */

function updateLobby(
    state
) {

    if (
        state.started
    ) {

        return;

    }


    playerList.innerHTML =
        "";


    for (
        const player of
        state.players
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "player-entry";


        div.textContent =
            player.name;


        if (
            player.id ===
            myId
        ) {

            div.textContent +=
                " (You)";

        }


        if (
            player.id ===
            state.hostId
        ) {

            div.classList.add(
                "host"
            );

        }


        playerList.appendChild(
            div
        );

    }

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(
    state
) {

    document.getElementById(
        "moneyValue"
    ).textContent =
        "$" +
        state.money;


    document.getElementById(
        "fuelValue"
    ).textContent =
        state.fuel +
        "/" +
        state.maxFuel;


    document.getElementById(
        "stockValue"
    ).textContent =
        state.stock +
        "/" +
        state.maxStock;


    document.getElementById(
        "cleanValue"
    ).textContent =
        state.cleanliness +
        "%";


    document.getElementById(
        "dayValue"
    ).textContent =
        "DAY " +
        state.day;

}


/* =====================================================
   KEYBOARD
===================================================== */

function setKey(
    key,
    value
) {

    if (
        key ===
        "w" ||
        key ===
        "ArrowUp"
    ) {

        keys.up =
            value;

    }


    if (
        key ===
        "s" ||
        key ===
        "ArrowDown"
    ) {

        keys.down =
            value;

    }


    if (
        key ===
        "a" ||
        key ===
        "ArrowLeft"
    ) {

        keys.left =
            value;

    }


    if (
        key ===
        "d" ||
        key ===
        "ArrowRight"
    ) {

        keys.right =
            value;

    }

}


window.addEventListener(
    "keydown",
    event => {

        setKey(
            event.key,
            true
        );


        if (
            event.key.toLowerCase() ===
            "e"
        ) {

            interact();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        setKey(
            event.key,
            false
        );

    }
);


/* =====================================================
   INPUT SEND
===================================================== */

setInterval(
    () => {

        if (
            !currentRoom ||
            !currentRoom.started
        ) {

            return;

        }


        socket.emit(
            "input",
            keys
        );

    },
    50
);


/* =====================================================
   INTERACT
===================================================== */

function interact() {

    socket.emit(
        "interact"
    );

}


document.getElementById(
    "interactButton"
).onclick =
    interact;


/* =====================================================
   HIRE BOT
===================================================== */

document.getElementById(
    "hireButton"
).onclick =
    () => {

        socket.emit(
            "hireBot"
        );

    };


/* =====================================================
   UPGRADES
===================================================== */

const upgradePanel =
    document.getElementById(
        "upgradePanel"
    );


document.getElementById(
    "upgradeButton"
).onclick =
    () => {

        upgradePanel.classList.remove(
            "hidden"
        );

    };


document.getElementById(
    "closeUpgrade"
).onclick =
    () => {

        upgradePanel.classList.add(
            "hidden"
        );

    };


document.querySelectorAll(
    "[data-upgrade]"
).forEach(
    button => {

        button.onclick =
            () => {

                socket.emit(
                    "upgrade",
                    button.dataset.upgrade
                );

            };

    }
);


/* =====================================================
   TOUCH CONTROLS
===================================================== */

function setupTouchButton(
    elementId,
    direction
) {

    const element =
        document.getElementById(
            elementId
        );


    const start =
        event => {

            event.preventDefault();

            keys[
                direction
            ] =
                true;

        };


    const end =
        event => {

            event.preventDefault();

            keys[
                direction
            ] =
                false;

        };


    element.addEventListener(
        "touchstart",
        start,
        {
            passive:
                false
        }
    );


    element.addEventListener(
        "touchend",
        end,
        {
            passive:
                false
        }
    );


    element.addEventListener(
        "touchcancel",
        end,
        {
            passive:
                false
        }
    );

}


setupTouchButton(
    "touchUp",
    "up"
);

setupTouchButton(
    "touchDown",
    "down"
);

setupTouchButton(
    "touchLeft",
    "left"
);

setupTouchButton(
    "touchRight",
    "right"
);


/* =====================================================
   DRAW HELPERS
===================================================== */

function drawRect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

}


function drawText(
    text,
    x,
    y,
    size = 10,
    color = "#fff"
) {

    ctx.fillStyle =
        color;

    ctx.font =
        size +
        "px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        text,
        x,
        y
    );

}


/* =====================================================
   STATION
===================================================== */

function drawStation() {

    /*
    Ground.
    */

    drawRect(
        0,
        0,
        640,
        360,
        "#7ca66a"
    );


    /*
    Parking lot.
    */

    drawRect(
        330,
        40,
        290,
        210,
        "#555"
    );


    /*
    Parking stripes.
    */

    ctx.strokeStyle =
        "#ddd";

    ctx.lineWidth =
        2;


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            350 +
            i * 45,
            50
        );

        ctx.lineTo(
            350 +
            i * 45,
            230
        );

        ctx.stroke();

    }


    /*
    Road.
    */

    drawRect(
        0,
        315,
        640,
        45,
        "#333"
    );


    ctx.strokeStyle =
        "#ffd43b";

    ctx.lineWidth =
        2;

    ctx.setLineDash(
        [
            12,
            12
        ]
    );


    ctx.beginPath();

    ctx.moveTo(
        0,
        337
    );

    ctx.lineTo(
        640,
        337
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /*
    Store building.
    */

    drawRect(
        35,
        45,
        270,
        235,
        "#ded6c7"
    );


    /*
    Store roof.
    */

    drawRect(
        30,
        38,
        280,
        20,
        "#d62828"
    );


    /*
    Store sign.
    */

    drawRect(
        100,
        50,
        140,
        28,
        "#222"
    );


    drawText(
        "OCTANE",
        170,
        69,
        16,
        "#fff"
    );


    /*
    Counter.
    */

    drawRect(
        110,
        85,
        80,
        35,
        "#9c6644"
    );


    drawText(
        "REGISTER",
        150,
        107,
        8,
        "#fff"
    );


    /*
    Shelves.
    */

    drawRect(
        215,
        85,
        65,
        35,
        "#795548"
    );


    drawText(
        "SHOP",
        247,
        107,
        9,
        "#fff"
    );


    /*
    Storage.
    */

    drawRect(
        215,
        245,
        65,
        30,
        "#6d4c41"
    );


    drawText(
        "STORAGE",
        247,
        264,
        8,
        "#fff"
    );


    /*
    Restroom.
    */

    drawRect(
        55,
        130,
        55,
        55,
        "#4dabf7"
    );


    drawText(
        "WC",
        82,
        163,
        14
    );


    /*
    Cleaning area.
    */

    drawRect(
        55,
        210,
        65,
        45,
        "#51cf66"
    );


    drawText(
        "CLEAN",
        87,
        237,
        9
    );


    /*
    Delivery area.
    */

    drawRect(
        475,
        270,
        85,
        35,
        "#f08c00"
    );


    drawText(
        "DELIVERY",
        517,
        292,
        8
    );


    /*
    Pumps.
    */

    const pumps = [

        {
            x:
                390,

            y:
                80
        },

        {
            x:
                490,

            y:
                80
        },

        {
            x:
                390,

            y:
                180
        },

        {
            x:
                490,

            y:
                180
        }

    ];


    const pumpCount =
        currentRoom &&
        currentRoom.upgrades
            ? currentRoom.upgrades.pumps
            : 2;


    for (
        let i = 0;
        i < pumpCount;
        i++
    ) {

        const pump =
            pumps[i];


        drawRect(
            pump.x -
            12,

            pump.y -
            18,

            24,

            36,

            "#e53935"
        );


        drawRect(
            pump.x -
            8,

            pump.y -
            12,

            16,

            8,

            "#222"
        );


        drawText(
            String(
                i + 1
            ),

            pump.x,

            pump.y +
            5,

            9
        );

    }

}


/* =====================================================
   PLAYER
===================================================== */

function drawWorker(
    worker,
    isMe = false
) {

    ctx.beginPath();

    ctx.arc(
        worker.x,
        worker.y,
        10,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        worker.color ||
        "#fff";


    ctx.fill();


    if (
        isMe
    ) {

        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth =
            2;

        ctx.stroke();

    }


    drawText(
        worker.name,
        worker.x,
        worker.y -
        15,
        8,
        "#fff"
    );


    if (
        worker.carrying
    ) {

        drawText(
            "📦",
            worker.x,
            worker.y +
            20,
            10
        );

    }

}


/* =====================================================
   CUSTOMER
===================================================== */

function drawCustomer(
    customer
) {

    let color =
        "#fff";


    if (
        customer.type ===
        "fuel"
    ) {

        color =
            "#ffd43b";

    }


    if (
        customer.type ===
        "shop"
    ) {

        color =
            "#74c0fc";

    }


    if (
        customer.type ===
        "fuelShop"
    ) {

        color =
            "#da77f2";

    }


    if (
        customer.type ===
        "restroom"
    ) {

        color =
            "#69db7c";

    }


    ctx.beginPath();

    ctx.arc(
        customer.x,
        customer.y,
        7,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;

    ctx.fill();


    if (
        customer.state ===
        "fueling"
    ) {

        drawRect(
            customer.x -
            10,

            customer.y -
            15,

            20,

            3,

            "#222"
        );


        drawRect(
            customer.x -
            10,

            customer.y -
            15,

            20 *
            (
                customer.fuelProgress /
                100
            ),

            3,

            "#51cf66"
        );

    }

}


/* =====================================================
   TASK
===================================================== */

function drawTask(
    task
) {

    let color =
        "#fff";

    let symbol =
        "?";


    if (
        task.type ===
        "clean"
    ) {

        color =
            "#51cf66";

        symbol =
            "CLEAN";

    }


    ctx.fillStyle =
        color;

    ctx.fillRect(
        task.x -
        8,

        task.y -
        8,

        16,

        16
    );


    drawText(
        symbol,
        task.x,
        task.y +
        25,
        7,
        color
    );

}


/* =====================================================
   DRAW
===================================================== */

function drawGame() {

    ctx.clearRect(
        0,
        0,
        640,
        360
    );


    drawStation();


    if (
        !currentRoom
    ) {

        return;

    }


    /*
    Tasks.
    */

    for (
        const task of
        currentRoom.tasks
    ) {

        drawTask(
            task
        );

    }


    /*
    Customers.
    */

    for (
        const customer of
        currentRoom.customers
    ) {

        drawCustomer(
            customer
        );

    }


    /*
    Bots.
    */

    for (
        const bot of
        currentRoom.bots
    ) {

        drawWorker(
            bot
        );

    }


    /*
    Players.
    */

    for (
        const player of
        currentRoom.players
    ) {

        drawWorker(
            player,

            player.id ===
            myId
        );

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    drawGame();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


</script>
