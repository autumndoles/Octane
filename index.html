<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>Octane</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;

    user-select: none;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =====================================================
   MAIN GAME
===================================================== */

#gameWrapper {

    position: relative;

    width: min(
        100vw,
        calc(100vh * 16 / 9)
    );

    aspect-ratio: 16 / 9;

}


#game {

    width: 100%;

    height: 100%;

    display: block;

    image-rendering: pixelated;

    background: #222;

}


/* =====================================================
   MENU
===================================================== */

#menu {

    position: absolute;

    inset: 0;

    background: #171717;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 20;

}


.menuBox {

    width: 90%;

    max-width: 360px;

    text-align: center;

}


.logo {

    font-size: 42px;

    font-weight: bold;

    margin-bottom: 5px;

}


.subtitle {

    color: #aaa;

    margin-bottom: 25px;

}


input {

    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: 0;

    border-radius: 6px;

    background: #292929;

    color: white;

    font-size: 16px;

    outline: none;

    text-align: center;

}


button {

    width: 100%;

    padding: 13px;

    margin-top: 7px;

    border: 0;

    border-radius: 6px;

    background: #f5a623;

    color: #111;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;

}


button:active {

    transform:
        translateY(1px);

}


#roomCodeDisplay {

    display: none;

    margin-top: 15px;

    padding: 12px;

    background: #252525;

    border-radius: 6px;

}


#roomCode {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 5px;

    color: #f5a623;

}


#error {

    color: #ff6b6b;

    margin-top: 10px;

    min-height: 18px;

}


/* =====================================================
   HUD
===================================================== */

#hud {

    position: absolute;

    top: 5px;

    left: 5px;

    right: 5px;

    display: flex;

    justify-content: space-between;

    pointer-events: none;

    z-index: 5;

}


.hudPanel {

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    padding: 5px 8px;

    border-radius: 4px;

    font-size: 11px;

}


#actions {

    position: absolute;

    right: 8px;

    top: 35px;

    width: 120px;

    z-index: 6;

}


#actions button {

    font-size: 11px;

    padding: 7px;

    margin-bottom: 4px;

}


/* =====================================================
   MOBILE CONTROLS
===================================================== */

#mobileControls {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 10;

}


#joystick {

    position: absolute;

    left: 15px;

    bottom: 15px;

    width: 100px;

    height: 100px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.12
        );

    pointer-events: auto;

}


#joystickKnob {

    position: absolute;

    width: 42px;

    height: 42px;

    left: 29px;

    top: 29px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.4
        );

}


#interactButton {

    position: absolute;

    right: 20px;

    bottom: 25px;

    width: 75px;

    height: 75px;

    border-radius: 50%;

    background:
        rgba(
            245,
            166,
            35,
            0.8
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    pointer-events: auto;

}


@media
(
    min-width: 700px
) {

    #mobileControls {

        display: none;

    }

}

</style>
</head>

<body>


<div id="gameWrapper">


<canvas
    id="game"
    width="480"
    height="270"
></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div
        class="hudPanel"
        id="stats"
    >
        $100
    </div>

    <div
        class="hudPanel"
        id="stationStats"
    >
        Fuel: 50 | Stock: 20
    </div>

</div>


<!-- =====================================================
     ACTIONS
===================================================== -->

<div id="actions">

    <button
        onclick="hireBot()"
    >
        Hire Employee ($50)
    </button>

    <button
        onclick="upgrade('pump')"
    >
        Upgrade Pump ($250)
    </button>

    <button
        onclick="upgrade('shelves')"
    >
        Upgrade Shelves ($200)
    </button>

    <button
        onclick="upgrade('employees')"
    >
        More Employees ($300)
    </button>

</div>


<!-- =====================================================
     MOBILE CONTROLS
===================================================== -->

<div id="mobileControls">

    <div
        id="joystick"
    >

        <div
            id="joystickKnob"
        ></div>

    </div>


    <div
        id="interactButton"
    >
        ACT
    </div>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            OCTANE
        </div>

        <div class="subtitle">
            Run the station together.
        </div>


        <input
            id="nameInput"
            placeholder="Your name"
            maxlength="20"
        >


        <button
            onclick="createRoom()"
        >
            Create Station
        </button>


        <div
            style="
                margin:12px 0;
                color:#777;
            "
        >
            OR
        </div>


        <input
            id="roomInput"
            placeholder="Room code"
            maxlength="4"
        >


        <button
            onclick="joinRoom()"
        >
            Join Station
        </button>


        <div
            id="roomCodeDisplay"
        >

            Give this code to your friends:

            <div
                id="roomCode"
            >
            </div>

            <button
                onclick="startGame()"
            >
                Start Shift
            </button>

        </div>


        <div
            id="error"
        >
        </div>

    </div>

</div>


</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =====================================================
   CONNECTION
===================================================== */

const socket =
    io(
        {
            transports:
                ["websocket"]
        }
    );


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "game"
    );

const ctx =
    canvas.getContext(
        "2d"
    );


ctx.imageSmoothingEnabled =
    false;


/* =====================================================
   GAME STATE
===================================================== */

let state =
    null;

let playerId =
    null;

let roomCode =
    null;

let isHost =
    false;


/* =====================================================
   LOCAL INPUT
===================================================== */

const input = {

    up:
        false,

    down:
        false,

    left:
        false,

    right:
        false

};


/* =====================================================
   INPUT SENDING
===================================================== */

let lastInput =
    "";


function sendInput() {

    const current =
        JSON.stringify(
            input
        );


    if (
        current !==
        lastInput
    ) {

        socket.emit(
            "input",
            input
        );

        lastInput =
            current;

    }

}


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {

    w:
        "up",

    ArrowUp:
        "up",

    s:
        "down",

    ArrowDown:
        "down",

    a:
        "left",

    ArrowLeft:
        "left",

    d:
        "right",

    ArrowRight:
        "right"

};


window.addEventListener(
    "keydown",
    e => {

        const direction =
            keys[
                e.key
            ];


        if (
            direction
        ) {

            input[
                direction
            ] =
                true;

            sendInput();

            e.preventDefault();

        }


        if (
            e.key ===
            "e" ||

            e.key ===
            " "
        ) {

            interact();

            e.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        const direction =
            keys[
                e.key
            ];


        if (
            direction
        ) {

            input[
                direction
            ] =
                false;

            sendInput();

            e.preventDefault();

        }

    }
);


/* =====================================================
   MENU FUNCTIONS
===================================================== */

function getName() {

    return (
        document
            .getElementById(
                "nameInput"
            )
            .value
            .trim()
        ||
        "Player"
    );

}


function createRoom() {

    socket.emit(
        "createRoom",
        getName()
    );

}


function joinRoom() {

    const code =
        document
            .getElementById(
                "roomInput"
            )
            .value
            .trim()
            .toUpperCase();


    if (
        code.length !==
        4
    ) {

        showError(
            "Enter a 4-character room code."
        );

        return;

    }


    socket.emit(
        "joinRoom",
        {

            code,

            name:
                getName()

        }
    );

}


function startGame() {

    socket.emit(
        "startGame"
    );

}


function showError(
    message
) {

    document
        .getElementById(
            "error"
        )
        .textContent =
        message;

}


/* =====================================================
   SOCKET EVENTS
===================================================== */

socket.on(
    "joined",
    data => {

        playerId =
            data.playerId;

        roomCode =
            data.roomCode;

        isHost =
            data.isHost;


        document
            .getElementById(
                "roomCode"
            )
            .textContent =
            roomCode;


        document
            .getElementById(
                "roomCodeDisplay"
            )
            .style.display =
            "block";


        if (
            !isHost
        ) {

            document
                .querySelector(
                    "#roomCodeDisplay button"
                )
                .style.display =
                "none";

        }

    }
);


socket.on(
    "errorMessage",
    message => {

        showError(
            message
        );

    }
);


socket.on(
    "state",
    newState => {

        state =
            newState;


        updateHUD();

    }
);


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    if (
        !state
    ) {

        return;

    }


    document
        .getElementById(
            "stats"
        )
        .textContent =
        "$" +
        state.money;


    document
        .getElementById(
            "stationStats"
        )
        .textContent =

        "Fuel: " +
        state.fuel +
        "/" +
        state.maxFuel +

        " | Stock: " +
        state.stock +
        "/" +
        state.maxStock +

        " | Clean: " +
        state.cleanliness +
        "%";

}


/* =====================================================
   INTERACTION
===================================================== */

function interact() {

    socket.emit(
        "interact"
    );

}


document
    .getElementById(
        "interactButton"
    )
    .addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            interact();

        },
        {
            passive:
                false
        }
    );


/* =====================================================
   BOT / UPGRADES
===================================================== */

function hireBot() {

    socket.emit(
        "hireBot"
    );

}


function upgrade(
    type
) {

    socket.emit(
        "upgrade",
        type
    );

}


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const knob =
    document.getElementById(
        "joystickKnob"
    );


let joystickActive =
    false;


function updateJoystick(
    event
) {

    const rect =
        joystick
            .getBoundingClientRect();


    const touch =
        event.touches[0];


    let x =
        touch.clientX -
        (
            rect.left +
            rect.width / 2
        );


    let y =
        touch.clientY -
        (
            rect.top +
            rect.height / 2
        );


    const max =
        35;


    const length =
        Math.sqrt(
            x * x +
            y * y
        );


    if (
        length >
        max
    ) {

        x =
            x /
            length *
            max;

        y =
            y /
            length *
            max;

    }


    knob.style.left =
        (
            29 +
            x
        ) +
        "px";


    knob.style.top =
        (
            29 +
            y
        ) +
        "px";


    input.up =
        y <
        -10;


    input.down =
        y >
        10;


    input.left =
        x <
        -10;


    input.right =
        x >
        10;


    sendInput();

}


joystick.addEventListener(
    "touchstart",
    e => {

        joystickActive =
            true;

        updateJoystick(
            e
        );

        e.preventDefault();

    },
    {
        passive:
            false
    }
);


joystick.addEventListener(
    "touchmove",
    e => {

        if (
            joystickActive
        ) {

            updateJoystick(
                e
            );

        }

        e.preventDefault();

    },
    {
        passive:
            false
    }
);


joystick.addEventListener(
    "touchend",
    () => {

        joystickActive =
            false;


        input.up =
            false;

        input.down =
            false;

        input.left =
            false;

        input.right =
            false;


        knob.style.left =
            "29px";

        knob.style.top =
            "29px";


        sendInput();

    }
);


/* =====================================================
   DRAWING
===================================================== */

function drawBackground() {

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        0,
        0,
        480,
        270
    );


    /*
    Store.
    */

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        20,
        30,
        250,
        210
    );


    /*
    Store floor.
    */

    ctx.fillStyle =
        "#555";

    ctx.fillRect(
        30,
        40,
        230,
        190
    );


    /*
    Outside.
    */

    ctx.fillStyle =
        "#242424";

    ctx.fillRect(
        280,
        30,
        190,
        210
    );


    /*
    Road.
    */

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        280,
        0,
        190,
        270
    );


    /*
    Register.
    */

    drawRect(
        140,
        105,
        25,
        25,
        "#e0a458"
    );


    /*
    Shelves.
    */

    drawRect(
        215,
        90,
        35,
        50,
        "#9b7653"
    );


    /*
    Storage.
    */

    drawRect(
        210,
        200,
        40,
        30,
        "#765438"
    );


    /*
    Restroom.
    */

    drawRect(
        45,
        100,
        40,
        35,
        "#5686a8"
    );


    /*
    Delivery.
    */

    drawRect(
        350,
        220,
        70,
        30,
        "#444"
    );


    /*
    Pumps.
    */

    for (
        let i = 0;
        i <
        4;
        i++
    ) {

        const pump =
            [
                {
                    x:
                        350,

                    y:
                        70
                },

                {
                    x:
                        420,

                    y:
                        70
                },

                {
                    x:
                        350,

                    y:
                        145
                },

                {
                    x:
                        420,

                    y:
                        145
                }

            ][i];


        drawRect(
            pump.x -
            8,

            pump.y -
            12,

            16,

            24,

            i <
            (
                state &&
                state.upgrades &&
                state.upgrades.pumps
            )
                ? "#d94848"
                : "#333"
        );

    }

}


/* =====================================================
   DRAW HELPERS
===================================================== */

function drawRect(
    x,
    y,
    width,
    height,
    color
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );

}


function drawCircle(
    x,
    y,
    radius,
    color
) {

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================================
   DRAW CUSTOMERS
===================================================== */

function drawCustomers() {

    if (
        !state
    ) {

        return;

    }


    for (
        const customer of
        state.customers
    ) {

        let color =
            "#eee";


        if (
            customer.type ===
            "fuel"
        ) {

            color =
                "#ff7777";

        }

        else if (
            customer.type ===
            "shop"
        ) {

            color =
                "#77aaff";

        }

        else if (
            customer.type ===
            "fuelShop"
        ) {

            color =
                "#bb77ff";

        }

        else {

            color =
                "#77ddaa";

        }


        drawCircle(
            customer.x,
            customer.y,
            5,
            color
        );

    }

}


/* =====================================================
   DRAW WORKERS
===================================================== */

function drawWorkers() {

    if (
        !state
    ) {

        return;

    }


    /*
    Bots.
    */

    for (
        const bot of
        state.bots
    ) {

        drawCircle(
            bot.x,
            bot.y,
            7,
            "#9b5de5"
        );


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "7px Arial";

        ctx.textAlign =
            "center";


        ctx.fillText(
            bot.name,
            bot.x,
            bot.y -
            10
        );

    }


    /*
    Players.
    */

    for (
        const player of
        state.players
    ) {

        drawCircle(
            player.x,
            player.y,
            7,
            player.color
        );


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "7px Arial";

        ctx.textAlign =
            "center";


        ctx.fillText(
            player.name,
            player.x,
            player.y -
            10
        );


        if (
            player.id ===
            playerId
        ) {

            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth =
                1;

            ctx.strokeRect(
                player.x -
                9,

                player.y -
                9,

                18,

                18
            );

        }

    }

}


/* =====================================================
   DRAW TASKS
===================================================== */

function drawTasks() {

    if (
        !state
    ) {

        return;

    }


    for (
        const task of
        state.tasks
    ) {

        if (
            task.type ===
            "clean"
        ) {

            drawCircle(
                task.x,
                task.y,
                5,
                "#76c893"
            );

        }

    }

}


/* =====================================================
   MAIN RENDER
===================================================== */

function render() {

    drawBackground();

    drawTasks();

    drawCustomers();

    drawWorkers();

}


/* =====================================================
   PERFORMANCE LOOP
===================================================== */

/*
30 FPS maximum.

The browser does not need
to render faster than this.
*/

let lastFrame =
    0;


function gameLoop(
    timestamp
) {

    if (
        timestamp -
        lastFrame >=
        33
    ) {

        lastFrame =
            timestamp;

        render();

    }


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =====================================================
   MENU VISIBILITY
===================================================== */

setInterval(
    () => {

        if (
            state &&
            state.players
                .some(
                    p =>
                        p.id ===
                        playerId
                )
        ) {

            document
                .getElementById(
                    "menu"
                )
                .style.display =
                "none";

        }

    },
    250
);

</script>

</body>
</html>
