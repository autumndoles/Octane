<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Octane</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;
}

canvas {

    display: block;

    background: #5d8f55;
}

#login {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #111;

    z-index: 100;
}

.loginBox {

    width: 350px;

    padding: 35px;

    border-radius: 15px;

    background: #222;

    text-align: center;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,0.5);
}

.loginBox h1 {

    margin: 0;

    font-size: 48px;
}

input {

    width: 100%;

    padding: 12px;

    margin: 10px 0;

    border: none;

    border-radius: 6px;

    font-size: 16px;
}

button {

    padding: 10px 15px;

    margin: 4px;

    border: none;

    border-radius: 6px;

    background: #e33;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    filter: brightness(1.2);
}

#hud {

    position: fixed;

    top: 10px;

    left: 10px;

    padding: 12px;

    min-width: 220px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.8);

    z-index: 10;
}

#hud h1 {

    margin: 0 0 8px;

    font-size: 24px;
}

.stat {

    margin: 4px 0;
}

#controls {

    position: fixed;

    bottom: 10px;

    left: 10px;

    padding: 10px;

    border-radius: 8px;

    background:
        rgba(0,0,0,0.75);

    z-index: 10;
}

#menu {

    position: fixed;

    top: 10px;

    right: 10px;

    width: 220px;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(0,0,0,0.8);

    z-index: 10;
}

#menu h3 {

    margin: 5px 0;
}

#error {

    color: #ff6666;

    margin: 10px;
}

</style>

</head>

<body>

<div id="login">

    <div class="loginBox">

        <h1>⛽</h1>

        <h2>OCTANE</h2>

        <p>
            Run the station.
            Work together.
            Make money.
        </p>

        <p>
            <b>Starting Cash: $100</b>
        </p>

        <input
            id="nameInput"
            placeholder="Enter your name"
            maxlength="20"
        >

        <button onclick="joinGame()">
            Enter Station
        </button>

        <div id="error"></div>

    </div>

</div>

<canvas id="gameCanvas"></canvas>

<div id="hud">

    <h1>⛽ OCTANE</h1>

    <div class="stat">
        💰 $<span id="money">100</span>
    </div>

    <div class="stat">
        ⛽ Fuel:
        <span id="fuel">40/100</span>
    </div>

    <div class="stat">
        📦 Store:
        <span id="stock">20/40</span>
    </div>

    <div class="stat">
        🧹 Clean:
        <span id="clean">100</span>%
    </div>

    <div class="stat">
        📅 Day:
        <span id="day">1</span>
    </div>

    <div class="stat">
        🕐 <span id="time">08:00</span>
    </div>

    <div class="stat">
        👥 Players:
        <span id="players">0/4</span>
    </div>

</div>

<div id="menu">

    <h3>Station</h3>

    <button onclick="hireBot()">
        🤖 Hire Worker ($50)
    </button>

    <hr>

    <h3>Upgrades</h3>

    <button onclick="upgrade('pump')">
        ⛽ Add Pump ($250)
    </button>

    <button onclick="upgrade('shelves')">
        🛒 Expand Store ($200)
    </button>

    <button onclick="upgrade('employees')">
        👷 More Workers ($300)
    </button>

</div>

<div id="controls">

    <b>WASD / Arrow Keys</b>
    <br>
    Move around
    <br>
    <b>E</b>
    Interact

</div>

<script>

const socket = io();

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let myId = null;

let state = {

    players: {},

    bots: {},

    customers: {},

    money: 100,

    fuel: 40,

    maxFuel: 100,

    storeStock: 20,

    maxStoreStock: 40,

    cleanliness: 100,

    day: 1,

    time: "08:00",

    upgrades: {

        pumps: 2,

        storeShelves: 2,

        employeeSlots: 2

    }

};

const keys = {};

let camera = {

    x: 0,

    y: 0

};

const WORLD_WIDTH = 1400;

const WORLD_HEIGHT = 800;

function joinGame() {

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();

    if (!name) {

        document.getElementById(
            "error"
        ).textContent =
            "Enter your name!";

        return;
    }

    socket.emit(
        "joinGame",
        name
    );
}

socket.on(
    "joined",
    data => {

        myId =
            data.id;

        document.getElementById(
            "login"
        ).style.display =
            "none";
    }
);

socket.on(
    "joinError",
    message => {

        document.getElementById(
            "error"
        ).textContent =
            message;
    }
);

window.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();

        keys[key] = true;

        if (
            key === "e" &&
            !e.repeat
        ) {

            socket.emit(
                "interact"
            );
        }
    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);

setInterval(
    () => {

        socket.emit(
            "move",
            {

                up:
                    keys["w"] ||
                    keys["arrowup"],

                down:
                    keys["s"] ||
                    keys["arrowdown"],

                left:
                    keys["a"] ||
                    keys["arrowleft"],

                right:
                    keys["d"] ||
                    keys["arrowright"]

            }
        );

    },
    50
);

socket.on(
    "gameState",
    newState => {

        state =
            newState;

        updateHUD();

    }
);

function updateHUD() {

    document.getElementById(
        "money"
    ).textContent =
        state.money;

    document.getElementById(
        "fuel"
    ).textContent =
        `${state.fuel}/${state.maxFuel}`;

    document.getElementById(
        "stock"
    ).textContent =
        `${state.storeStock}/${state.maxStoreStock}`;

    document.getElementById(
        "clean"
    ).textContent =
        state.cleanliness;

    document.getElementById(
        "day"
    ).textContent =
        state.day;

    document.getElementById(
        "time"
    ).textContent =
        state.time;

    document.getElementById(
        "players"
    ).textContent =
        `${state.playerCount}/${state.maxPlayers}`;
}

function hireBot() {

    socket.emit(
        "hireBot"
    );
}

function upgrade(type) {

    socket.emit(
        "upgrade",
        type
    );
}

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();

function updateCamera() {

    const player =
        state.players[
            myId
        ];

    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD_WIDTH -
                canvas.width,

                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD_HEIGHT -
                canvas.height,

                camera.y
            )
        );
}

function drawStation() {

    ctx.fillStyle =
        "#5d8f55";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "#444";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        WORLD_WIDTH,
        130
    );

    ctx.fillRect(
        -camera.x,
        650 - camera.y,
        WORLD_WIDTH,
        150
    );

    ctx.fillStyle =
        "#d5d5d5";

    ctx.fillRect(
        350 - camera.x,
        170 - camera.y,
        550,
        430
    );

    ctx.fillStyle =
        "#d83232";

    ctx.fillRect(
        350 - camera.x,
        170 - camera.y,
        550,
        65
    );

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 32px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "OCTANE",
        625 - camera.x,
        215 - camera.y
    );

    ctx.fillStyle =
        "#333";

    ctx.fillRect(
        470 - camera.x,
        230 - camera.y,
        120,
        80
    );

    ctx.fillStyle =
        "white";

    ctx.font =
        "16px Arial";

    ctx.fillText(
        "REGISTER",
        530 - camera.x,
        275 - camera.y
    );

    ctx.fillStyle =
        "#8b5a2b";

    ctx.fillRect(
        680 - camera.x,
        230 - camera.y,
        150,
        200
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        "STORE",
        755 - camera.x,
        330 - camera.y
    );

    ctx.fillStyle =
        "#704214";

    ctx.fillRect(
        390 - camera.x,
        450 - camera.y,
        150,
        100
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        "STORAGE",
        465 - camera.x,
        505 - camera.y
    );

    ctx.fillStyle =
        "#2288aa";

    ctx.fillRect(
        570 - camera.x,
        500 - camera.y,
        120,
        70
    );

    ctx.fillStyle =
        "white";

    ctx.fillText(
        "CLEAN",
        630 - camera.x,
        540 - camera.y
    );

    for (
        let i = 0;
        i < state.upgrades.pumps;
        i++
    ) {

        const pump =
            getPumpPosition(i);

        ctx.fillStyle =
            "#333";

        ctx.fillRect(
            pump.x - 30 - camera.x,
            pump.y - 50 - camera.y,
            60,
            100
        );

        ctx.fillStyle =
            "#e33";

        ctx.fillRect(
            pump.x - 20 - camera.x,
            pump.y - 40 - camera.y,
            40,
            30
        );

        ctx.fillStyle =
            "white";

        ctx.fillText(
            "PUMP " + (i + 1),
            pump.x - camera.x,
            pump.y + 20 - camera.y
        );
    }
}

function getPumpPosition(index) {

    if (index === 0) {

        return {
            x: 980,
            y: 230
        };
    }

    if (index === 1) {

        return {
            x: 1120,
            y: 230
        };
    }

    return {

        x:
            980 +
            index * 70,

        y: 230

    };
}

function drawEntity(
    entity,
    color,
    label
) {

    const x =
        entity.x -
        camera.x;

    const y =
        entity.y -
        camera.y;

    ctx.fillStyle =
        "rgba(0,0,0,0.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y + 12,
        14,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        15,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        2;

    ctx.stroke();

    ctx.fillStyle =
        "white";

    ctx.font =
        "12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x,
        y - 22
    );
}

function drawPlayers() {

    for (
        const player of
        Object.values(
            state.players || {}
        )
    ) {

        drawEntity(
            player,
            player.color,
            player.name
        );
    }
}

function drawBots() {

    for (
        const bot of
        Object.values(
            state.bots || {}
        )
    ) {

        drawEntity(
            bot,
            "#9b59b6",
            "🤖 " + bot.name
        );
    }
}

function drawCustomers() {

    for (
        const customer of
        Object.values(
            state.customers || {}
        )
    ) {

        let color =
            "#f5a623";

        if (
            customer.state ===
            "leaving"
        ) {

            color =
                "#777";
        }

        drawEntity(
            customer,
            color,
            "Customer"
        );
    }
}

function gameLoop() {

    updateCamera();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStation();

    drawCustomers();

    drawBots();

    drawPlayers();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>

</body>

</html>
