<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Octane</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #171717;

    color: white;

    font-family:
        Arial,
        sans-serif;
}

button {

    border: none;

    border-radius: 7px;

    padding: 11px;

    margin: 4px;

    color: white;

    background: #d93434;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    filter: brightness(1.2);
}

input {

    width: 100%;

    padding: 12px;

    margin: 7px 0;

    border: none;

    border-radius: 7px;

    font-size: 16px;
}

.screen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #171717;

    z-index: 100;
}

.box {

    width: min(
        90%,
        420px
    );

    padding: 30px;

    text-align: center;

    border-radius: 12px;

    background: #252525;

    box-shadow:
        0 10px 30px
        rgba(
            0,
            0,
            0,
            0.5
        );
}

.logo {

    font-size: 60px;
}

h1 {

    margin: 5px 0;

    font-size: 42px;
}

.hidden {

    display: none !important;
}

#error {

    color: #ff7777;

    margin-top: 10px;
}

#roomCode {

    font-size: 38px;

    letter-spacing: 8px;

    margin: 20px 0;

    font-weight: bold;
}

#playersList {

    margin: 15px 0;

    padding: 10px;

    border-radius: 7px;

    background: #191919;

    min-height: 60px;
}

#gameCanvas {

    display: block;

    width: 100%;

    height: 100%;

    image-rendering: auto;
}

#hud {

    position: fixed;

    top: 10px;

    left: 10px;

    z-index: 10;

    padding: 10px;

    min-width: 190px;

    border-radius: 8px;

    background:
        rgba(
            0,
            0,
            0,
            0.8
        );

    font-size: 14px;
}

#hud h2 {

    margin: 0 0 7px;
}

.stat {

    margin: 3px 0;
}

#menu {

    position: fixed;

    top: 10px;

    right: 10px;

    z-index: 10;

    width: 220px;

    padding: 10px;

    border-radius: 8px;

    background:
        rgba(
            0,
            0,
            0,
            0.8
        );
}

#menu h3 {

    margin: 5px 0 8px;
}

#menu button {

    width: 100%;
}

#controls {

    position: fixed;

    bottom: 10px;

    left: 10px;

    z-index: 10;

    padding: 8px;

    border-radius: 7px;

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    font-size: 13px;
}

#roomDisplay {

    position: fixed;

    top: 10px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding: 7px 15px;

    border-radius: 20px;

    background:
        rgba(
            0,
            0,
            0,
            0.8
        );

    font-weight: bold;
}

</style>

</head>

<body>

<!-- MAIN MENU -->

<div
    id="mainMenu"
    class="screen"
>

    <div class="box">

        <div class="logo">
            ⛽
        </div>

        <h1>OCTANE</h1>

        <p>
            Run the gas station
            together.
        </p>

        <input
            id="nameInput"
            maxlength="20"
            placeholder="Your name"
        >

        <button
            onclick="showCreate()"
        >
            CREATE GAME
        </button>

        <button
            onclick="showJoin()"
        >
            JOIN GAME
        </button>

        <div id="error"></div>

    </div>

</div>

<!-- CREATE GAME -->

<div
    id="createScreen"
    class="screen hidden"
>

    <div class="box">

        <h1>Game Created!</h1>

        <p>
            Give this code to
            your friends:
        </p>

        <div id="roomCode">
            ----
        </div>

        <div id="playersList">
            Waiting for players...
        </div>

        <button
            id="startButton"
            onclick="startGame()"
        >
            START GAME
        </button>

        <button
            onclick="location.reload()"
        >
            CANCEL
        </button>

    </div>

</div>

<!-- JOIN GAME -->

<div
    id="joinScreen"
    class="screen hidden"
>

    <div class="box">

        <h1>Join Game</h1>

        <input
            id="joinCode"
            maxlength="4"
            placeholder="ROOM CODE"
            style="
                text-transform:
                uppercase;
                text-align:
                center;
                letter-spacing:
                5px;
            "
        >

        <button
            onclick="joinRoom()"
        >
            JOIN
        </button>

        <button
            onclick="showMain()"
        >
            BACK
        </button>

        <div id="joinError"></div>

    </div>

</div>

<canvas
    id="gameCanvas"
></canvas>

<div
    id="roomDisplay"
    class="hidden"
>
    ROOM: <span id="roomCodeHUD"></span>
</div>

<div
    id="hud"
    class="hidden"
>

    <h2>
        ⛽ OCTANE
    </h2>

    <div class="stat">
        💰 $
        <span id="money">
            100
        </span>
    </div>

    <div class="stat">
        ⛽ Fuel:
        <span id="fuel">
            40/100
        </span>
    </div>

    <div class="stat">
        📦 Store:
        <span id="stock">
            20/40
        </span>
    </div>

    <div class="stat">
        🧹 Clean:
        <span id="clean">
            100
        </span>%
    </div>

    <div class="stat">
        📅 Day:
        <span id="day">
            1
        </span>
    </div>

    <div class="stat">
        🕐
        <span id="time">
            08:00
        </span>
    </div>

    <div class="stat">
        👥
        <span id="players">
            0/4
        </span>
    </div>

</div>

<div
    id="menu"
    class="hidden"
>

    <h3>
        Hire Employee
    </h3>

    <button
        onclick="hireBot('fuel')"
    >
        ⛽ Pump Worker $50
    </button>

    <button
        onclick="hireBot('cashier')"
    >
        💵 Cashier $50
    </button>

    <button
        onclick="hireBot('restocker')"
    >
        📦 Restocker $50
    </button>

    <button
        onclick="hireBot('cleaner')"
    >
        🧹 Cleaner $50
    </button>

    <h3>
        Upgrades
    </h3>

    <button
        onclick="upgrade('pump')"
    >
        ⛽ Add Pump $250
    </button>

    <button
        onclick="upgrade('shelves')"
    >
        🛒 Bigger Store $200
    </button>

    <button
        onclick="upgrade('employees')"
    >
        👷 More Employees $300
    </button>

</div>

<div
    id="controls"
    class="hidden"
>

    <b>WASD</b> /
    Arrow Keys:
    Move

    <br>

    <b>E:</b>
    Interact

</div>

<script>

const socket =
    io({
        transports: [
            "websocket",
            "polling"
        ]
    });

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );

const WORLD = {

    width: 1400,

    height: 800

};

let state = {

    players: {},

    bots: {},

    customers: {},

    upgrades: {
        pumps: 2
    }

};

let myId = null;

let roomCode = null;

let isHost = false;

let lastFrame = 0;

const keys = {};

const camera = {

    x: 0,

    y: 0

};

function hideAllScreens() {

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            screen =>
                screen.classList.add(
                    "hidden"
                )
        );
}

function showMain() {

    hideAllScreens();

    document
        .getElementById(
            "mainMenu"
        )
        .classList.remove(
            "hidden"
        );
}

function showCreate() {

    const name =
        document
        .getElementById(
            "nameInput"
        )
        .value
        .trim();

    if (!name) {

        document
            .getElementById(
                "error"
            )
            .textContent =
                "Enter your name.";

        return;
    }

    socket.emit(
        "createRoom",
        name
    );
}

function showJoin() {

    const name =
        document
        .getElementById(
            "nameInput"
        )
        .value
        .trim();

    if (!name) {

        document
            .getElementById(
                "error"
            )
            .textContent =
                "Enter your name first.";

        return;
    }

    hideAllScreens();

    document
        .getElementById(
            "joinScreen"
        )
        .classList.remove(
            "hidden"
        );
}

function joinRoom() {

    const name =
        document
        .getElementById(
            "nameInput"
        )
        .value
        .trim();

    const code =
        document
        .getElementById(
            "joinCode"
        )
        .value
        .trim()
        .toUpperCase();

    if (
        code.length !== 4
    ) {

        document
            .getElementById(
                "joinError"
            )
            .textContent =
                "Enter a 4-character room code.";

        return;
    }

    socket.emit(
        "joinRoom",
        {
            name,
            code
        }
    );
}

socket.on(
    "roomJoined",
    data => {

        myId =
            data.playerId;

        roomCode =
            data.roomCode;

        isHost =
            data.hostId ===
            myId;

        document
            .getElementById(
                "roomCode"
            )
            .textContent =
            roomCode;

        document
            .getElementById(
                "roomCodeHUD"
            )
            .textContent =
            roomCode;

        hideAllScreens();

        if (
            !state.started
        ) {

            document
                .getElementById(
                    "createScreen"
                )
                .classList.remove(
                    "hidden"
                );
        }
    }
);

socket.on(
    "roomError",
    message => {

        document
            .getElementById(
                "joinError"
            )
            .textContent =
            message;
    }
);

socket.on(
    "gameState",
    newState => {

        state =
            newState;

        roomCode =
            state.roomCode;

        isHost =
            state.hostId ===
            myId;

        updateHUD();

        updateLobby();

        if (
            state.started
        ) {

            hideAllScreens();

            document
                .getElementById(
                    "hud"
                )
                .classList.remove(
                    "hidden"
                );

            document
                .getElementById(
                    "menu"
                )
                .classList.remove(
                    "hidden"
                );

            document
                .getElementById(
                    "controls"
                )
                .classList.remove(
                    "hidden"
                );

            document
                .getElementById(
                    "roomDisplay"
                )
                .classList.remove(
                    "hidden"
                );
        }
    }
);

function updateLobby() {

    if (
        state.started
    ) {
        return;
    }

    const list =
        document
            .getElementById(
                "playersList"
            );

    const players =
        Object.values(
            state.players ||
            {}
        );

    list.innerHTML =
        players
            .map(
                player =>
                    `👤 ${escapeHTML(
                        player.name
                    )}`
            )
            .join(
                "<br>"
            );

    const startButton =
        document
            .getElementById(
                "startButton"
            );

    startButton.style.display =
        isHost
            ? "inline-block"
            : "none";
}

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}

function startGame() {

    if (
        isHost
    ) {

        socket.emit(
            "startGame"
        );
    }
}

function hireBot(
    job
) {

    socket.emit(
        "hireBot",
        job
    );
}

function upgrade(
    type
) {

    socket.emit(
        "upgrade",
        type
    );
}

function updateHUD() {

    document
        .getElementById(
            "money"
        )
        .textContent =
        state.money;

    document
        .getElementById(
            "fuel"
        )
        .textContent =
        `${state.fuel}/${state.maxFuel}`;

    document
        .getElementById(
            "stock"
        )
        .textContent =
        `${state.storeStock}/${state.maxStoreStock}`;

    document
        .getElementById(
            "clean"
        )
        .textContent =
        state.cleanliness;

    document
        .getElementById(
            "day"
        )
        .textContent =
        state.day;

    document
        .getElementById(
            "time"
        )
        .textContent =
        state.time;

    document
        .getElementById(
            "players"
        )
        .textContent =
        `${state.playerCount}/${state.maxPlayers}`;
}

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] =
            true;

        if (
            key === "e" &&
            !event.repeat
        ) {

            socket.emit(
                "interact"
            );
        }
    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] =
            false;
    }
);

setInterval(
    () => {

        socket.emit(
            "move",
            {

                up:
                    keys.w ||
                    keys.arrowup,

                down:
                    keys.s ||
                    keys.arrowdown,

                left:
                    keys.a ||
                    keys.arrowleft,

                right:
                    keys.d ||
                    keys.arrowright

            }
        );

    },
    66
);

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

function updateCamera() {

    const player =
        state.players[
            myId
        ];

    if (!player) {
        return;
    }

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                WORLD.width -
                canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                WORLD.height -
                canvas.height,
                camera.y
            )
        );
}

function drawWorld() {

    ctx.fillStyle =
        "#5d8f55";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Road

    ctx.fillStyle =
        "#444";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        WORLD.width,
        130
    );

    ctx.fillRect(
        -camera.x,
        650 -
        camera.y,
        WORLD.width,
        150
    );

    // Building

    ctx.fillStyle =
        "#ddd";

    ctx.fillRect(
        350 -
        camera.x,
        170 -
        camera.y,
        550,
        430
    );

    // Roof

    ctx.fillStyle =
        "#d93434";

    ctx.fillRect(
        350 -
        camera.x,
        170 -
        camera.y,
        550,
        65
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "bold 30px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "OCTANE",
        625 -
        camera.x,
        213 -
        camera.y
    );

    drawBox(
        470,
        230,
        120,
        80,
        "#333",
        "REGISTER"
    );

    drawBox(
        680,
        230,
        150,
        200,
        "#8b5a2b",
        "STORE"
    );

    drawBox(
        390,
        450,
        150,
        100,
        "#704214",
        "STORAGE"
    );

    drawBox(
        570,
        500,
        120,
        70,
        "#2288aa",
        "CLEAN"
    );

    for (
        let i = 0;
        i <
        state.upgrades.pumps;
        i++
    ) {

        const pump =
            getPump(i);

        drawBox(
            pump.x - 30,
            pump.y - 50,
            60,
            100,
            "#333",
            "PUMP"
        );
    }
}

function getPump(
    index
) {

    const pumps = [

        {
            x: 980,
            y: 230
        },

        {
            x: 1120,
            y: 230
        },

        {
            x: 1260,
            y: 230
        },

        {
            x: 1330,
            y: 230
        }

    ];

    return pumps[index];
}

function drawBox(
    x,
    y,
    width,
    height,
    color,
    text
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x -
        camera.x,
        y -
        camera.y,
        width,
        height
    );

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "13px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        text,
        x +
        width / 2 -
        camera.x,
        y +
        height / 2 -
        camera.y
    );
}

function drawEntity(
    entity,
    color,
    label
) {

    const x =
        entity.x -
        camera.x;

    const y =
        entity.y -
        camera.y;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        14,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff";

    ctx.font =
        "11px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x,
        y - 19
    );
}

function drawPlayers() {

    for (
        const player of
        Object.values(
            state.players ||
            {}
        )
    ) {

        drawEntity(
            player,
            player.color,
            player.name
        );
    }
}

function drawBots() {

    for (
        const bot of
        Object.values(
            state.bots ||
            {}
        )
    ) {

        drawEntity(
            bot,
            "#9b59b6",
            "BOT"
        );
    }
}

function drawCustomers() {

    for (
        const customer of
        Object.values(
            state.customers ||
            {}
        )
    ) {

        let color =
            "#f5a623";

        if (
            customer.state ===
            "leaving"
        ) {

            color =
                "#777";
        }

        drawEntity(
            customer,
            color,
            "Customer"
        );
    }
}

function render(
    timestamp
) {

    if (
        timestamp -
        lastFrame <
        33
    ) {

        requestAnimationFrame(
            render
        );

        return;
    }

    lastFrame =
        timestamp;

    updateCamera();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();

    drawCustomers();

    drawBots();

    drawPlayers();

    requestAnimationFrame(
        render
    );
}

requestAnimationFrame(
    render
);

</script>

</body>

</html>
