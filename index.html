
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Octane</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;

    touch-action: none;

}

button,
input {

    font-family:
        Arial,
        sans-serif;

}

button {

    cursor: pointer;

}


/* =====================================================
   MENU
===================================================== */

#menu {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #111,
            #1b1b1b
        );

    z-index: 10;

}


.menuBox {

    width: min(
        90vw,
        420px
    );

    padding: 30px;

    background: #222;

    border:
        1px solid
        #444;

    border-radius: 14px;

    text-align: center;

    box-shadow:
        0 10px 40px
        rgba(
            0,
            0,
            0,
            0.5
        );

}


.logo {

    font-size: 48px;

    font-weight: bold;

    letter-spacing: 3px;

    margin-bottom: 5px;

}


.subtitle {

    color: #aaa;

    margin-bottom: 25px;

}


input {

    width: 100%;

    padding: 13px;

    margin-bottom: 10px;

    border: none;

    border-radius: 7px;

    background: #333;

    color: white;

    font-size: 16px;

    outline: none;

}


.menuButton {

    width: 100%;

    padding: 13px;

    margin-top: 8px;

    border: none;

    border-radius: 7px;

    background: #e63946;

    color: white;

    font-size: 16px;

    font-weight: bold;

}


.menuButton:hover {

    filter:
        brightness(1.15);

}


#roomCodeDisplay {

    margin-top: 20px;

    padding: 15px;

    background: #333;

    border-radius: 8px;

    display: none;

}


#roomCode {

    font-size: 32px;

    font-weight: bold;

    letter-spacing: 5px;

}


#startButton {

    display: none;

}


/* =====================================================
   GAME
===================================================== */

#game {

    display: none;

    position: fixed;

    inset: 0;

}


#gameCanvas {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    background: #78a85a;

    image-rendering:
        pixelated;

}


/* =====================================================
   HUD
===================================================== */

#hud {

    position: fixed;

    top: 10px;

    left: 10px;

    right: 10px;

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    pointer-events: none;

    z-index: 2;

}


.hudPanel {

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    border-radius: 8px;

    padding: 9px 12px;

    font-size: 14px;

}


#stats {

    line-height: 1.6;

}


#actions {

    pointer-events: auto;

    display: flex;

    gap: 6px;

    flex-wrap: wrap;

    justify-content: flex-end;

}


.actionButton {

    border: none;

    border-radius: 6px;

    padding:
        8px
        10px;

    background: #333;

    color: white;

    font-weight: bold;

}


.actionButton:hover {

    background: #444;

}


/* =====================================================
   TASK MESSAGE
===================================================== */

#taskMessage {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%);

    padding:
        10px
        16px;

    background:
        rgba(
            0,
            0,
            0,
            0.8
        );

    border-radius: 8px;

    font-size: 14px;

    pointer-events: none;

    z-index: 3;

    text-align: center;

}


/* =====================================================
   CONTROLS
===================================================== */

#controls {

    position: fixed;

    bottom: 15px;

    left: 15px;

    z-index: 4;

}


#joystick {

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.12
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            0.2
        );

    position: relative;

}


#joystickKnob {

    position: absolute;

    width: 50px;

    height: 50px;

    left: 40px;

    top: 40px;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            0.35
        );

}


#actButton {

    position: fixed;

    right: 25px;

    bottom: 30px;

    width: 80px;

    height: 80px;

    border-radius: 50%;

    border: none;

    background: #e63946;

    color: white;

    font-size: 18px;

    font-weight: bold;

    z-index: 4;

}


#actButton:active {

    transform:
        scale(0.94);

}


/* =====================================================
   MOBILE
===================================================== */

@media (
    max-width: 600px
) {

    .logo {

        font-size: 38px;

    }


    #hud {

        font-size: 11px;

    }


    .hudPanel {

        padding:
            6px
            8px;

    }


    #actions {

        max-width:
            180px;

    }


    .actionButton {

        font-size: 11px;

        padding:
            6px
            7px;

    }

}

</style>

</head>

<body>


<!-- =================================================
     MENU
================================================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            OCTANE
        </div>

        <div class="subtitle">
            Run the station. Together.
        </div>


        <input
            id="nameInput"
            placeholder="Your name"
            maxlength="20"
        >


        <button
            class="menuButton"
            id="createButton"
        >
            Create Station
        </button>


        <div style="
            margin: 15px 0;
            color: #777;
        ">
            OR
        </div>


        <input
            id="roomInput"
            placeholder="Room code"
            maxlength="4"
        >


        <button
            class="menuButton"
            id="joinButton"
        >
            Join Station
        </button>


        <div id="roomCodeDisplay">

            <div>
                Your station code:
            </div>

            <div id="roomCode">
                ----
            </div>

            <div style="
                margin-top: 10px;
                color: #aaa;
                font-size: 13px;
            ">
                Give this code to your friends.
            </div>

        </div>


        <button
            class="menuButton"
            id="startButton"
        >
            Start Shift
        </button>


        <div
            id="menuMessage"
            style="
                margin-top: 15px;
                color: #ff8888;
                font-size: 14px;
            "
        ></div>

    </div>

</div>


<!-- =================================================
     GAME
================================================= -->

<div id="game">

    <canvas
        id="gameCanvas"
        width="960"
        height="540"
    ></canvas>


    <!-- HUD -->

    <div id="hud">

        <div
            class="hudPanel"
            id="stats"
        >
            Money: $100<br>
            Fuel: 50<br>
            Stock: 20<br>
            Clean: 100%
        </div>


        <div
            class="hudPanel"
            id="actions"
        >

            <button
                class="actionButton"
                id="hireButton"
            >
                Hire Employee ($50)
            </button>


            <button
                class="actionButton"
                id="pumpUpgrade"
            >
                Pump ($250)
            </button>


            <button
                class="actionButton"
                id="shelfUpgrade"
            >
                Shelves ($200)
            </button>


            <button
                class="actionButton"
                id="employeeUpgrade"
            >
                Employee Slot ($300)
            </button>

        </div>

    </div>


    <div id="taskMessage">
        Walk around the station and press ACT near something that needs doing.
    </div>


    <!-- MOBILE CONTROLS -->

    <div id="controls">

        <div id="joystick">

            <div id="joystickKnob"></div>

        </div>

    </div>


    <button id="actButton">
        ACT
    </button>

</div>


<script
    src="/socket.io/socket.io.js"
></script>


<script>

/* =====================================================
   SOCKET
===================================================== */

const socket =
    io();


/* =====================================================
   ELEMENTS
===================================================== */

const menu =
    document.getElementById(
        "menu"
    );

const game =
    document.getElementById(
        "game"
    );

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

const nameInput =
    document.getElementById(
        "nameInput"
    );

const roomInput =
    document.getElementById(
        "roomInput"
    );

const roomCodeDisplay =
    document.getElementById(
        "roomCodeDisplay"
    );

const roomCode =
    document.getElementById(
        "roomCode"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const menuMessage =
    document.getElementById(
        "menuMessage"
    );

const stats =
    document.getElementById(
        "stats"
    );

const taskMessage =
    document.getElementById(
        "taskMessage"
    );


/* =====================================================
   GAME STATE
===================================================== */

let myId =
    null;

let currentRoom =
    null;

let gameStarted =
    false;


const input = {

    up:
        false,

    down:
        false,

    left:
        false,

    right:
        false

};


/* =====================================================
   CREATE ROOM
===================================================== */

document
    .getElementById(
        "createButton"
    )
    .onclick =
    () => {

        const name =
            nameInput.value
                .trim();


        if (
            !name
        ) {

            menuMessage.textContent =
                "Enter your name first.";

            return;

        }


        socket.emit(
            "createRoom",
            name
        );

    };


/* =====================================================
   JOIN ROOM
===================================================== */

document
    .getElementById(
        "joinButton"
    )
    .onclick =
    () => {

        const name =
            nameInput.value
                .trim();

        const code =
            roomInput.value
                .trim()
                .toUpperCase();


        if (
            !name
        ) {

            menuMessage.textContent =
                "Enter your name first.";

            return;

        }


        if (
            code.length !== 4
        ) {

            menuMessage.textContent =
                "Enter a 4-character room code.";

            return;

        }


        socket.emit(
            "joinRoom",
            {

                name,

                code

            }
        );

    };


/* =====================================================
   JOINED
===================================================== */

socket.on(
    "joined",
    data => {

        myId =
            data.playerId;


        roomCode.textContent =
            data.roomCode;


        roomCodeDisplay.style.display =
            "block";


        startButton.style.display =
            "block";


        document
            .getElementById(
                "createButton"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "joinButton"
            )
            .style.display =
            "none";


        nameInput.style.display =
            "none";


        roomInput.style.display =
            "none";

    }
);


/* =====================================================
   ERROR
===================================================== */

socket.on(
    "errorMessage",
    message => {

        menuMessage.textContent =
            message;

    }
);


/* =====================================================
   START
===================================================== */

startButton.onclick =
    () => {

        socket.emit(
            "startGame"
        );

    };


/* =====================================================
   STATE
===================================================== */

socket.on(
    "state",
    state => {

        currentRoom =
            state;


        if (
            state.started &&
            !gameStarted
        ) {

            gameStarted =
                true;

            menu.style.display =
                "none";

            game.style.display =
                "block";

        }


        updateHUD();

        updateTaskMessage();

    }
);


/* =====================================================
   INPUT
===================================================== */

function sendInput() {

    socket.emit(
        "input",
        input
    );

}


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "w" ||
            event.key ===
            "ArrowUp"
        ) {

            input.up =
                true;

        }


        if (
            event.key ===
            "s" ||
            event.key ===
            "ArrowDown"
        ) {

            input.down =
                true;

        }


        if (
            event.key ===
            "a" ||
            event.key ===
            "ArrowLeft"
        ) {

            input.left =
                true;

        }


        if (
            event.key ===
            "d" ||
            event.key ===
            "ArrowRight"
        ) {

            input.right =
                true;

        }


        sendInput();

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.key ===
            "w" ||
            event.key ===
            "ArrowUp"
        ) {

            input.up =
                false;

        }


        if (
            event.key ===
            "s" ||
            event.key ===
            "ArrowDown"
        ) {

            input.down =
                false;

        }


        if (
            event.key ===
            "a" ||
            event.key ===
            "ArrowLeft"
        ) {

            input.left =
                false;

        }


        if (
            event.key ===
            "d" ||
            event.key ===
            "ArrowRight"
        ) {

            input.right =
                false;

        }


        sendInput();

    }
);


/* =====================================================
   ACT
===================================================== */

function interact() {

    socket.emit(
        "interact"
    );

}


document
    .getElementById(
        "actButton"
    )
    .onclick =
    interact;


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "e" ||
            event.key ===
            " "
        ) {

            event.preventDefault();

            interact();

        }

    }
);


/* =====================================================
   HIRE EMPLOYEE
===================================================== */

document
    .getElementById(
        "hireButton"
    )
    .onclick =
    () => {

        socket.emit(
            "hireBot"
        );

    };


/* =====================================================
   UPGRADES
===================================================== */

document
    .getElementById(
        "pumpUpgrade"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "pump"
        );

    };


document
    .getElementById(
        "shelfUpgrade"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "shelves"
        );

    };


document
    .getElementById(
        "employeeUpgrade"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "employees"
        );

    };


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    if (
        !currentRoom
    ) {

        return;

    }


    stats.innerHTML =

        "Money: $" +
        currentRoom.money +

        "<br>Fuel: " +
        currentRoom.fuel +
        "/" +
        currentRoom.maxFuel +

        "<br>Stock: " +
        currentRoom.stock +
        "/" +
        currentRoom.maxStock +

        "<br>Clean: " +
        currentRoom.cleanliness +
        "%" +

        "<br>Day: " +
        currentRoom.day;

}


/* =====================================================
   TASK MESSAGE
===================================================== */

function updateTaskMessage() {

    if (
        !currentRoom
    ) {

        return;

    }


    const player =
        currentRoom.players.find(
            p =>
                p.id ===
                myId
        );


    if (
        !player
    ) {

        return;

    }


    if (
        player.task
    ) {

        const names = {

            fuel:
                "Fueling a customer...",

            cashier:
                "Running the register...",

            restock:
                "Restocking the shelves...",

            clean:
                "Cleaning the station...",

            delivery:
                "Refueling the station..."

        };


        taskMessage.textContent =
            names[
                player.task
            ] ||
            "Working...";


        return;

    }


    taskMessage.textContent =
        "Walk around the station and press ACT near something that needs doing.";

}


/* =====================================================
   DRAWING
===================================================== */

function resizeCanvas() {

    const scale =
        Math.min(

            window.innerWidth /
                960,

            window.innerHeight /
                540

        );


    canvas.style.width =
        960 *
        scale +
        "px";


    canvas.style.height =
        540 *
        scale +
        "px";

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =====================================================
   DRAW STATION
===================================================== */

function drawStation() {

    ctx.fillStyle =
        "#78a85a";

    ctx.fillRect(
        0,
        0,
        960,
        540
    );


    /*
    Building
    */

    ctx.fillStyle =
        "#d8d8d8";

    ctx.fillRect(
        100,
        80,
        500,
        400
    );


    /*
    Interior
    */

    ctx.fillStyle =
        "#eeeeee";

    ctx.fillRect(
        120,
        100,
        460,
        360
    );


    /*
    Register
    */

    drawStationObject(
        330,
        220,
        80,
        55,
        "#8b5a2b",
        "REGISTER"
    );


    /*
    Shelves
    */

    drawStationObject(
        500,
        220,
        80,
        55,
        "#6c757d",
        "SHELVES"
    );


    /*
    Storage
    */

    drawStationObject(
        500,
        430,
        80,
        55,
        "#795548",
        "STORAGE"
    );


    /*
    Cleaning
    */

    drawStationObject(
        270,
        430,
        80,
        55,
        "#219ebc",
        "CLEAN"
    );


    /*
    Delivery
    */

    drawStationObject(
        720,
        500,
        100,
        40,
        "#495057",
        "DELIVERY"
    );


    /*
    Pumps
    */

    if (
        currentRoom
    ) {

        for (
            let i = 0;
            i <
            currentRoom
                .upgrades
                .pumps;
            i++
        ) {

            const pump =
                [
                    {
                        x: 700,
                        y: 170
                    },

                    {
                        x: 820,
                        y: 170
                    },

                    {
                        x: 700,
                        y: 300
                    },

                    {
                        x: 820,
                        y: 300
                    }

                ][i];


            drawStationObject(
                pump.x,
                pump.y,
                55,
                55,
                "#343a40",
                "PUMP"
            );

        }

    }

}


function drawStationObject(
    x,
    y,
    width,
    height,
    color,
    label
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x -
            width /
            2,

        y -
            height /
            2,

        width,
        height
    );


    ctx.fillStyle =
        "white";

    ctx.font =
        "10px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x,
        y +
            4
    );

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(
    player
) {

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        12,
        0,
        Math.PI *
        2
    );


    ctx.fillStyle =
        player.color;

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.stroke();


    ctx.fillStyle =
        "white";

    ctx.font =
        "11px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        player.name,
        player.x,
        player.y -
            17
    );


    if (
        player.task
    ) {

        ctx.font =
            "9px Arial";

        ctx.fillText(
            player.task,
            player.x,
            player.y +
                25
        );

    }

}


/* =====================================================
   DRAW BOT
===================================================== */

function drawBot(
    bot
) {

    ctx.beginPath();

    ctx.arc(
        bot.x,
        bot.y,
        11,
        0,
        Math.PI *
        2
    );


    ctx.fillStyle =
        "#9b5de5";

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.stroke();


    ctx.fillStyle =
        "white";

    ctx.font =
        "10px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        bot.name,
        bot.x,
        bot.y -
            16
    );


    if (
        bot.task
    ) {

        ctx.font =
            "8px Arial";

        ctx.fillText(
            bot.task,
            bot.x,
            bot.y +
                23
        );

    }

}


/* =====================================================
   DRAW CUSTOMER
===================================================== */

function drawCustomer(
    customer
) {

    ctx.beginPath();

    ctx.arc(
        customer.x,
        customer.y,
        9,
        0,
        Math.PI *
        2
    );


    ctx.fillStyle =
        customer.state ===
        "leaving"

            ? "#888"

            : "#f1c40f";


    ctx.fill();


    ctx.strokeStyle =
        "#222";

    ctx.stroke();


    if (
        customer.state ===
        "waitingFuel"
    ) {

        ctx.fillStyle =
            "white";

        ctx.font =
            "9px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "FUEL",
            customer.x,
            customer.y -
                13
        );

    }


    if (
        customer.state ===
        "waitingCheckout"
    ) {

        ctx.fillStyle =
            "white";

        ctx.font =
            "9px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "$",
            customer.x,
            customer.y -
                13
        );

    }

}


/* =====================================================
   DRAW TASK
===================================================== */

function drawTask(
    task
) {

    ctx.fillStyle =
        "#00ffff";

    ctx.beginPath();

    ctx.arc(
        task.x,
        task.y,
        7,
        0,
        Math.PI *
        2
    );

    ctx.fill();


    ctx.fillStyle =
        "black";

    ctx.font =
        "9px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "CLEAN",
        task.x,
        task.y +
            3
    );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    if (
        !currentRoom
    ) {

        requestAnimationFrame(
            render
        );

        return;

    }


    ctx.clearRect(
        0,
        0,
        960,
        540
    );


    drawStation();


    /*
    Cleaning tasks
    */

    for (
        const task of
        currentRoom.tasks
    ) {

        drawTask(
            task
        );

    }


    /*
    Customers
    */

    for (
        const customer of
        currentRoom.customers
    ) {

        drawCustomer(
            customer
        );

    }


    /*
    Players
    */

    for (
        const player of
        currentRoom.players
    ) {

        drawPlayer(
            player
        );

    }


    /*
    Bots
    */

    for (
        const bot of
        currentRoom.bots
    ) {

        drawBot(
            bot
        );

    }


    requestAnimationFrame(
        render
    );

}


render();


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const knob =
    document.getElementById(
        "joystickKnob"
    );


let joystickActive =
    false;


function updateJoystick(
    event
) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width /
        2;


    const centerY =
        rect.top +
        rect.height /
        2;


    let dx =
        event.clientX -
        centerX;


    let dy =
        event.clientY -
        centerY;


    const max =
        40;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        length >
        max
    ) {

        dx =
            dx /
            length *
            max;

        dy =
            dy /
            length *
            max;

    }


    knob.style.transform =
        `translate(${dx}px, ${dy}px)`;


    input.left =
        dx <
        -10;


    input.right =
        dx >
        10;


    input.up =
        dy <
        -10;


    input.down =
        dy >
        10;


    sendInput();

}


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive =
            true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event
        );

    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (
            joystickActive
        ) {

            updateJoystick(
                event
            );

        }

    }
);


joystick.addEventListener(
    "pointerup",
    () => {

        joystickActive =
            false;


        knob.style.transform =
            "translate(0, 0)";


        input.up =
            false;

        input.down =
            false;

        input.left =
            false;

        input.right =
            false;


        sendInput();

    }
);


/* =====================================================
   PREVENT MOBILE SCROLL
===================================================== */

document.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive:
            false
    }
);

</script>
