
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Octane</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        sans-serif;

}

button,
input {

    font-family:
        Arial,
        sans-serif;

}

button {

    cursor: pointer;

    border: none;

    border-radius: 8px;

    padding:
        10px 15px;

    background: #e63946;

    color: white;

    font-weight: bold;

}

button:active {

    transform:
        scale(0.96);

}

input {

    padding:
        11px;

    border-radius: 7px;

    border: 1px solid #555;

    background: #222;

    color: white;

    width: 100%;

}


/* =====================================================
   MENU
===================================================== */

#menu {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #111,
            #242424
        );

    z-index: 100;

}

.menuBox {

    width:
        min(
            92vw,
            420px
        );

    padding:
        25px;

    border-radius:
        15px;

    background:
        #1b1b1b;

    box-shadow:
        0 10px 40px
        rgba(
            0,
            0,
            0,
            0.5
        );

    text-align:
        center;

}

.logo {

    font-size:
        48px;

    font-weight:
        900;

    letter-spacing:
        3px;

    color:
        #ffb703;

    margin-bottom:
        5px;

}

.subtitle {

    color:
        #aaa;

    margin-bottom:
        25px;

}

.menuSection {

    margin-top:
        15px;

}

.menuSection button {

    width:
        100%;

    margin-top:
        8px;

}

#error {

    color:
        #ff6b6b;

    min-height:
        20px;

    margin-top:
        10px;

}


/* =====================================================
   GAME
===================================================== */

#game {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    background:
        #101010;

}


/*
Canvas is deliberately displayed
at a scaled resolution.

The actual internal canvas is only
960 x 540, reducing GPU work.
*/

#canvas {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        100vw;

    height:
        100vh;

    object-fit:
        contain;

    image-rendering:
        auto;

}


/* =====================================================
   HUD
===================================================== */

#hud {

    position:
        fixed;

    top:
        10px;

    left:
        10px;

    right:
        10px;

    display:
        flex;

    justify-content:
        space-between;

    pointer-events:
        none;

    z-index:
        10;

}

.stats {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        6px;

    max-width:
        75%;

}

.stat {

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    padding:
        7px 10px;

    border-radius:
        7px;

    font-size:
        13px;

}

#roomLabel {

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    padding:
        7px 10px;

    border-radius:
        7px;

    font-size:
        13px;

}


/* =====================================================
   BOTTOM CONTROLS
===================================================== */

#bottomUI {

    position:
        fixed;

    bottom:
        15px;

    left:
        15px;

    right:
        15px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        flex-end;

    pointer-events:
        none;

    z-index:
        20;

}

#bottomUI > * {

    pointer-events:
        auto;

}


/* =====================================================
   JOYSTICK
===================================================== */

#joystick {

    width:
        120px;

    height:
        120px;

    border-radius:
        50%;

    background:
        rgba(
            255,
            255,
            255,
            0.12
        );

    border:
        2px solid
        rgba(
            255,
            255,
            255,
            0.25
        );

    position:
        relative;

    touch-action:
        none;

}

#joystickKnob {

    position:
        absolute;

    width:
        50px;

    height:
        50px;

    border-radius:
        50%;

    background:
        rgba(
            255,
            255,
            255,
            0.55
        );

    left:
        35px;

    top:
        35px;

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

#actions {

    display:
        flex;

    gap:
        10px;

}

.actionButton {

    width:
        70px;

    height:
        70px;

    border-radius:
        50%;

    background:
        #e63946;

    font-size:
        13px;

    touch-action:
        manipulation;

}


/* =====================================================
   SIDE PANEL
===================================================== */

#panel {

    position:
        fixed;

    right:
        10px;

    top:
        60px;

    width:
        min(
            230px,
            75vw
        );

    max-height:
        70vh;

    overflow-y:
        auto;

    background:
        rgba(
            15,
            15,
            15,
            0.95
        );

    border-radius:
        10px;

    padding:
        12px;

    display:
        none;

    z-index:
        30;

}

#panel h3 {

    margin-top:
        0;

}

.panelButton {

    width:
        100%;

    margin-top:
        7px;

    background:
        #333;

}

.closeButton {

    background:
        #555;

}


/* =====================================================
   START BUTTON
===================================================== */

#startGameButton {

    display:
        none;

    position:
        fixed;

    top:
        50%;

    left:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index:
        50;

    font-size:
        18px;

    padding:
        15px 30px;

}


/* =====================================================
   DESKTOP
===================================================== */

@media (
    min-width: 700px
) {

    #joystick {

        display:
            none;

    }

}

</style>

</head>


<body>


<!-- ===================================================
     MENU
=================================================== -->

<div id="menu">

<div class="menuBox">

<div class="logo">
OCTANE
</div>

<div class="subtitle">
Run the station. Make the money.
</div>


<div class="menuSection">

<input
    id="nameInput"
    placeholder="Your name"
    maxlength="20"
>


<button
    id="createButton"
>
Create Private Room
</button>

</div>


<div class="menuSection">

<input
    id="roomInput"
    placeholder="Room code"
    maxlength="4"
>

<button
    id="joinButton"
>
Join Room
</button>

</div>


<div id="error"></div>

</div>

</div>


<!-- ===================================================
     GAME
=================================================== -->

<div id="game">


<canvas
    id="canvas"
    width="960"
    height="540"
></canvas>


<!-- HUD -->

<div id="hud">

<div class="stats">

<div class="stat">
💰 $<span id="money">100</span>
</div>

<div class="stat">
⛽ <span id="fuel">50</span>
</div>

<div class="stat">
📦 <span id="stock">20</span>
</div>

<div class="stat">
🧹 <span id="clean">100</span>%
</div>

<div class="stat">
📅 Day <span id="day">1</span>
</div>

</div>

<div id="roomLabel">
Room: ----
</div>

</div>


<!-- START GAME -->

<button
    id="startGameButton"
>
Start Shift
</button>


<!-- SIDE PANEL -->

<div id="panel">

<h3>
Octane Menu
</h3>

<button
    class="panelButton"
    id="hireFuel"
>
Hire Fuel Attendant - $50
</button>

<button
    class="panelButton"
    id="hireCashier"
>
Hire Cashier - $50
</button>

<button
    class="panelButton"
    id="hireRestocker"
>
Hire Restocker - $50
</button>

<button
    class="panelButton"
    id="hireCleaner"
>
Hire Cleaner - $50
</button>

<hr>

<button
    class="panelButton"
    id="upgradePump"
>
Add Pump - $250
</button>

<button
    class="panelButton"
    id="upgradeShelves"
>
Expand Shelves - $200
</button>

<button
    class="panelButton"
    id="upgradeEmployees"
>
Employee Slot - $300
</button>

<button
    class="panelButton closeButton"
    id="closePanel"
>
Close
</button>

</div>


<!-- BOTTOM UI -->

<div id="bottomUI">


<div id="joystick">

<div id="joystickKnob"></div>

</div>


<div id="actions">

<button
    class="actionButton"
    id="interactButton"
>
ACT
</button>

<button
    class="actionButton"
    id="menuButton"
>
MENU
</button>

</div>

</div>

</div>


<script>

/* =====================================================
   SOCKET
===================================================== */

const socket =
    io();


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext(
        "2d",
        {
            alpha: false
        }
    );


/*
Disable smoothing for
simple pixel-ish shapes.
*/

ctx.imageSmoothingEnabled =
    false;


/* =====================================================
   GAME STATE
===================================================== */

let state =
    null;

let myId =
    null;

let roomCode =
    null;


/* =====================================================
   LOCAL PLAYER
===================================================== */

const localPlayer = {

    x:
        420,

    y:
        520

};


/* =====================================================
   INPUT
===================================================== */

const input = {

    up:
        false,

    down:
        false,

    left:
        false,

    right:
        false

};


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        updateKeyboard();

    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

        updateKeyboard();

    }
);


function updateKeyboard() {

    input.up =
        keys.w ||
        keys.arrowup;

    input.down =
        keys.s ||
        keys.arrowdown;

    input.left =
        keys.a ||
        keys.arrowleft;

    input.right =
        keys.d ||
        keys.arrowright;

}


/* =====================================================
   SEND INPUT
===================================================== */

setInterval(
    () => {

        if (
            !state
        ) {

            return;

        }

        socket.emit(
            "input",
            input
        );

    },
    100
);


/* =====================================================
   LOCAL MOVEMENT PREDICTION
===================================================== */

function updateLocalMovement() {

    let dx = 0;

    let dy = 0;

    if (
        input.up
    ) {

        dy--;

    }

    if (
        input.down
    ) {

        dy++;

    }

    if (
        input.left
    ) {

        dx--;

    }

    if (
        input.right
    ) {

        dx++;

    }

    if (
        dx === 0 &&
        dy === 0
    ) {

        return;

    }

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    dx /=
        length;

    dy /=
        length;

    localPlayer.x +=
        dx * 3;

    localPlayer.y +=
        dy * 3;

}


/* =====================================================
   TOUCH JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const knob =
    document.getElementById(
        "joystickKnob"
    );

let joystickActive =
    false;


function handleJoystick(
    x,
    y
) {

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width /
        2;

    const centerY =
        rect.top +
        rect.height /
        2;

    let dx =
        x -
        centerX;

    let dy =
        y -
        centerY;

    const max =
        35;

    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        length >
        max
    ) {

        dx =
            dx /
            length *
            max;

        dy =
            dy /
            length *
            max;

    }

    knob.style.left =
        (
            35 +
            dx
        ) +
        "px";

    knob.style.top =
        (
            35 +
            dy
        ) +
        "px";


    input.left =
        dx <
        -10;

    input.right =
        dx >
        10;

    input.up =
        dy <
        -10;

    input.down =
        dy >
        10;

}


joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive =
            true;

        joystick.setPointerCapture(
            e.pointerId
        );

        handleJoystick(
            e.clientX,
            e.clientY
        );

    }
);


joystick.addEventListener(
    "pointermove",
    e => {

        if (
            !joystickActive
        ) {

            return;

        }

        handleJoystick(
            e.clientX,
            e.clientY
        );

    }
);


function stopJoystick() {

    joystickActive =
        false;

    input.up =
        false;

    input.down =
        false;

    input.left =
        false;

    input.right =
        false;

    knob.style.left =
        "35px";

    knob.style.top =
        "35px";

}


joystick.addEventListener(
    "pointerup",
    stopJoystick
);

joystick.addEventListener(
    "pointercancel",
    stopJoystick
);


/* =====================================================
   INTERACT
===================================================== */

document
    .getElementById(
        "interactButton"
    )
    .addEventListener(
        "click",
        () => {

            socket.emit(
                "interact"
            );

        }
    );


/* =====================================================
   MENU
===================================================== */

const menu =
    document.getElementById(
        "menu"
    );

const game =
    document.getElementById(
        "game"
    );

const error =
    document.getElementById(
        "error"
    );


document
    .getElementById(
        "createButton"
    )
    .onclick =
    () => {

        error.textContent =
            "";

        socket.emit(
            "createRoom",
            document
                .getElementById(
                    "nameInput"
                )
                .value
        );

    };


document
    .getElementById(
        "joinButton"
    )
    .onclick =
    () => {

        error.textContent =
            "";

        socket.emit(
            "joinRoom",
            {

                code:
                    document
                        .getElementById(
                            "roomInput"
                        )
                        .value,

                name:
                    document
                        .getElementById(
                            "nameInput"
                        )
                        .value

            }
        );

    };


/* =====================================================
   JOINED
===================================================== */

socket.on(
    "joined",
    data => {

        roomCode =
            data.roomCode;

        myId =
            data.playerId;

        menu.style.display =
            "none";

        game.style.display =
            "block";

        document
            .getElementById(
                "roomLabel"
            )
            .textContent =
            "Room: " +
            roomCode;

    }
);


/* =====================================================
   ERROR
===================================================== */

socket.on(
    "errorMessage",
    message => {

        error.textContent =
            message;

    }
);


/* =====================================================
   STATE
===================================================== */

socket.on(
    "state",
    newState => {

        state =
            newState;


        /*
        Keep local movement
        visually smooth.

        Server remains authoritative.
        */

        const serverPlayer =
            state.players.find(
                p =>
                    p.id ===
                    myId
            );

        if (
            serverPlayer
        ) {

            /*
            Small correction only.
            */

            localPlayer.x +=
                (
                    serverPlayer.x -
                    localPlayer.x
                ) *
                0.15;

            localPlayer.y +=
                (
                    serverPlayer.y -
                    localPlayer.y
                ) *
                0.15;

        }


        updateHUD();


        if (
            state.hostId ===
            myId &&
            !state.started
        ) {

            document
                .getElementById(
                    "startGameButton"
                )
                .style.display =
                "block";

        } else {

            document
                .getElementById(
                    "startGameButton"
                )
                .style.display =
                "none";

        }

    }
);


/* =====================================================
   START
===================================================== */

document
    .getElementById(
        "startGameButton"
    )
    .onclick =
    () => {

        socket.emit(
            "startGame"
        );

    };


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    if (
        !state
    ) {

        return;

    }

    document
        .getElementById(
            "money"
        )
        .textContent =
        state.money;

    document
        .getElementById(
            "fuel"
        )
        .textContent =
        state.fuel +
        "/" +
        state.maxFuel;

    document
        .getElementById(
            "stock"
        )
        .textContent =
        state.stock +
        "/" +
        state.maxStock;

    document
        .getElementById(
            "clean"
        )
        .textContent =
        state.cleanliness;

    document
        .getElementById(
            "day"
        )
        .textContent =
        state.day;

}


/* =====================================================
   PANEL
===================================================== */

const panel =
    document.getElementById(
        "panel"
    );


document
    .getElementById(
        "menuButton"
    )
    .onclick =
    () => {

        panel.style.display =
            panel.style.display ===
            "block"
                ? "none"
                : "block";

    };


document
    .getElementById(
        "closePanel"
    )
    .onclick =
    () => {

        panel.style.display =
            "none";

    };


/* =====================================================
   BOT HIRING
===================================================== */

function hireBot(
    job
) {

    socket.emit(
        "hireBot",
        job
    );

}


document
    .getElementById(
        "hireFuel"
    )
    .onclick =
    () =>
        hireBot(
            "fuel"
        );


document
    .getElementById(
        "hireCashier"
    )
    .onclick =
    () =>
        hireBot(
            "cashier"
        );


document
    .getElementById(
        "hireRestocker"
    )
    .onclick =
    () =>
        hireBot(
            "restocker"
        );


document
    .getElementById(
        "hireCleaner"
    )
    .onclick =
    () =>
        hireBot(
            "cleaner"
        );


/* =====================================================
   UPGRADES
===================================================== */

document
    .getElementById(
        "upgradePump"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "pump"
        );

    };


document
    .getElementById(
        "upgradeShelves"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "shelves"
        );

    };


document
    .getElementById(
        "upgradeEmployees"
    )
    .onclick =
    () => {

        socket.emit(
            "upgrade",
            "employees"
        );

    };


/* =====================================================
   DRAWING
===================================================== */

function drawStation() {

    /*
    Ground
    */

    ctx.fillStyle =
        "#3a3a3a";

    ctx.fillRect(
        0,
        0,
        960,
        540
    );


    /*
    Road
    */

    ctx.fillStyle =
        "#202020";

    ctx.fillRect(
        0,
        0,
        960,
        100
    );

    ctx.fillRect(
        0,
        440,
        960,
        100
    );


    /*
    Store
    */

    ctx.fillStyle =
        "#d8d8d8";

    ctx.fillRect(
        170,
        100,
        420,
        330
    );


    /*
    Store roof
    */

    ctx.fillStyle =
        "#e63946";

    ctx.fillRect(
        170,
        100,
        420,
        35
    );


    /*
    Register
    */

    drawStationObject(
        330,
        220,
        "#ffb703",
        "REGISTER"
    );


    /*
    Shelves
    */

    drawStationObject(
        500,
        220,
        "#4dabf7",
        "SHELVES"
    );


    /*
    Storage
    */

    drawStationObject(
        500,
        430,
        "#9b5de5",
        "STORAGE"
    );


    /*
    Cleaning
    */

    drawStationObject(
        270,
        430,
        "#51cf66",
        "CLEAN"
    );


    /*
    Delivery
    */

    drawStationObject(
        720,
        500,
        "#f77f00",
        "DELIVERY"
    );


    /*
    Pumps
    */

    if (
        state
    ) {

        for (
            let i = 0;
            i <
            state.upgrades.pumps;
            i++
        ) {

            const pump =
                [
                    [700,170],
                    [820,170],
                    [700,300],
                    [820,300]
                ][i];

            ctx.fillStyle =
                "#555";

            ctx.fillRect(
                pump[0] -
                20,
                pump[1] -
                20,
                40,
                40
            );

            ctx.fillStyle =
                "#ffb703";

            ctx.fillRect(
                pump[0] -
                10,
                pump[1] -
                10,
                20,
                20
            );

        }

    }

}


function drawStationObject(
    x,
    y,
    color,
    label
) {

    ctx.fillStyle =
        color;

    ctx.fillRect(
        x -
        30,
        y -
        30,
        60,
        60
    );

    ctx.fillStyle =
        "#111";

    ctx.font =
        "10px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        label,
        x,
        y +
        4
    );

}


/* =====================================================
   ENTITY DRAWING
===================================================== */

function drawPlayer(
    player
) {

    ctx.fillStyle =
        player.color;

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        14,
        0,
        Math.PI *
        2
    );

    ctx.fill();


    ctx.fillStyle =
        "white";

    ctx.font =
        "11px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        player.name,
        player.x,
        player.y -
        20
    );

}


function drawBot(
    bot
) {

    ctx.fillStyle =
        "#aaaaaa";

    ctx.fillRect(
        bot.x -
        11,
        bot.y -
        11,
        22,
        22
    );

    ctx.fillStyle =
        "white";

    ctx.font =
        "9px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "BOT",
        bot.x,
        bot.y +
        3
    );

}


function drawCustomer(
    customer
) {

    ctx.fillStyle =
        "#f1fa8c";

    ctx.beginPath();

    ctx.arc(
        customer.x,
        customer.y,
        11,
        0,
        Math.PI *
        2
    );

    ctx.fill();


    /*
    Progress bar
    */

    if (
        customer.state ===
        "fueling"
    ) {

        drawProgress(
            customer.x,
            customer.y -
            18,
            customer.fuelProgress
        );

    }

    if (
        customer.state ===
        "checkingOut"
    ) {

        drawProgress(
            customer.x,
            customer.y -
            18,
            customer.checkoutProgress
        );

    }

}


function drawProgress(
    x,
    y,
    progress
) {

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        x -
        15,
        y,
        30,
        4
    );

    ctx.fillStyle =
        "#51cf66";

    ctx.fillRect(
        x -
        15,
        y,
        30 *
        (
            progress /
            100
        ),
        4
    );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    /*
    Clear
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    Station
    */

    drawStation();


    if (
        !state
    ) {

        return;

    }


    /*
    Draw customers
    */

    for (
        const customer of
        state.customers
    ) {

        drawCustomer(
            customer
        );

    }


    /*
    Draw bots
    */

    for (
        const bot of
        state.bots
    ) {

        drawBot(
            bot
        );

    }


    /*
    Draw players

    The local player uses
    predicted coordinates.
    */

    for (
        const player of
        state.players
    ) {

        if (
            player.id ===
            myId
        ) {

            drawPlayer({

                ...player,

                x:
                    localPlayer.x,

                y:
                    localPlayer.y

            });

        } else {

            drawPlayer(
                player
            );

        }

    }


    /*
    Draw tasks
    */

    for (
        const task of
        state.tasks
    ) {

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "20px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "!",
            task.x,
            task.y
        );

    }

}


/* =====================================================
   30 FPS GAME LOOP
===================================================== */

let lastFrame =
    0;

const FRAME_TIME =
    1000 /
    30;


function gameLoop(
    timestamp
) {

    if (
        timestamp -
        lastFrame >=
        FRAME_TIME
    ) {

        lastFrame =
            timestamp;

        updateLocalMovement();

        render();

    }

    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);


/* =====================================================
   PREVENT MOBILE SCROLLING
===================================================== */

document.addEventListener(
    "touchmove",
    e => {

        if (
            e.target.closest(
                "#joystick"
            )
        ) {

            e.preventDefault();

        }

    },
    {
        passive:
            false
    }
);


/* =====================================================
   CONNECTION STATUS
===================================================== */

socket.on(
    "connect",
    () => {

        console.log(
            "Connected to Octane server."
        );

    }
);


socket.on(
    "disconnect",
    () => {

        console.log(
            "Disconnected from server."
        );

    }
);

</script>
